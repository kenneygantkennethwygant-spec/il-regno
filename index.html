.section{padding:17px 0}.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:14px}.section h2{margin:0;font-size:22px}.kicker{color:var(--red);font-size:10px;font-weight:900;letter-spacing:1.5px;margin-bottom:4px}
.live-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.live-card{background:#0d0f14;border:1px solid var(--line);border-radius:17px;overflow:hidden;cursor:pointer;transition:.2s;min-width:0}.live-card:hover{transform:translateY(-4px);border-color:#ff304877}.preview{aspect-ratio:16/9;background:#090a0d;position:relative;overflow:hidden}.preview img,.preview video{width:100%;height:100%;object-fit:cover;display:block}.livebadge{position:absolute;z-index:2;left:9px;top:9px;background:var(--red);font-size:9px;font-weight:900;padding:5px 7px;border-radius:7px}.liveinfo{padding:11px 12px 13px}.liveinfo b{font-size:14px}.liveinfo small{display:block;color:var(--muted);margin-top:4px}
.rail{display:flex;gap:13px;overflow-x:auto;scrollbar-width:none;padding-bottom:12px}.rail::-webkit-scrollbar{display:none}.card{flex:0 0 184px;background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden}.thumb{aspect-ratio:16/9;background:#15171e;display:grid;place-items:center}.thumb img{width:100%;height:100%;object-fit:cover}.play{width:42px;height:42px;border-radius:50%;background:var(--red);display:grid;place-items:center}.card-body{padding:11px 12px}.title{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:var(--muted);font-size:11px;margin-top:5px}

.search{display:none;position:fixed;inset:0;background:#05060aee;z-index:100;padding:90px 20px}.search.open{display:block}.search input{width:min(800px,100%);display:block;margin:auto;padding:17px;border-radius:15px;border:1px solid var(--line);background:#14161d;color:#fff;font-size:18px}

function renderLive(all=false){const g=document.getElementById("liveGrid");g.innerHTML="";const items=arr("live-tv");if(!items.length){g.innerHTML='<div style="grid-column:1/-1;color:#999;padding:30px">Nessun canale disponibile.</div>';return}items.slice(0,all?999:8).forEach((x,i)=>g.appendChild(liveCard(x,i)));}
function contentCard(x,category,i){const name=pick(x,["name","title","channel","nome"])||"Contenuto "+(i+1),img=pick(x,["logo","image","poster","thumb","thumbnail"]),url=pick(x,["url","stream","src","link","m3u8"]);const c=document.createElement("article");c.className="content-card";c.innerHTML='<div class="content-thumb">'+(img?'<img src="'+esc(img)+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'">':'')+'<div class="content-icon" '+(img?'style="display:none"':'')+'>'+(x.icon||"🎬")+'</div></div><div class="content-body"><b>'+esc(name)+'</b><small>'+esc(NAMES[category]||category)+(url?' · Apri':'')+'</small></div>';c.onclick=()=>{if(url)window.open(url,"_blank","noopener,noreferrer")};return c}
function showCategory(category){document.querySelectorAll('.category-nav a').forEach(a=>a.classList.toggle('active',a.dataset.category===category));const live=document.getElementById('live');const box=document.getElementById('categoryContent');if(category==='live-tv'){live.style.display='block';box.style.display='none';window.scrollTo({top:0,behavior:'smooth'});return}live.style.display='none';box.style.display='block';const items=arr(category);box.innerHTML='<div class="category-panel"><div class="category-panel-head"><div><div class="kicker">'+esc(NAMES[category]||category)+'</div><h2>'+esc(NAMES[category]||category)+'</h2><p>'+items.length+' contenut'+(items.length===1?'o':'i')+' disponibili</p></div><button class="btn category-back">← Live TV</button></div><div class="content-grid" id="contentGrid"></div></div>';const grid=document.getElementById('contentGrid');if(!items.length){grid.innerHTML='<div style="grid-column:1/-1;color:#999;padding:25px">Nessun contenuto disponibile in questa categoria.</div>';}else items.forEach((x,i)=>grid.appendChild(contentCard(x,category,i)));box.querySelector('.category-back').onclick=()=>showCategory('live-tv');window.scrollTo({top:0,behavior:'smooth'});}
function initCategories(){document.querySelectorAll('.category-nav a').forEach(a=>{const map={'Live TV':'live-tv','Film':'film','Serie TV':'serie-tv','Sport':'sport','Cartoni':'cartoni','Anime':'anime'};const key=map[a.textContent.trim()];a.dataset.category=key;a.addEventListener('click',e=>{e.preventDefault();if(key==='live-tv'){showCategory('live-tv');return}const items=arr(key);const url=items.length?pick(items[0],['url','stream','src','link','m3u8']):'';if(url){window.location.href=url;}});});}
initCategories();renderLive();
document.getElementById('allLive').onclick=()=>renderLive(true);
document.getElementById('closePlayer').addEventListener('click', closePlayer);
document.getElementById('modal').addEventListener('click', e=>{ if(e.target.id==='modal') closePlayer(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closePlayer(); });
</script>

<script>
(function(){
  const ADMIN_PASSWORD = "regno2024";
  let adminLogged = false;

  const panel=document.getElementById("adminPanel");
  const rows=document.getElementById("adminRows");
  const cat=document.getElementById("adminCategory");
  const status=document.getElementById("adminStatus");

  function adminItems(){
    const x=DEFAULT_DATA?.[cat.value];
    return Array.isArray(x)?x:(x&&typeof x==="object"?Object.values(x):[]);
  }
  function renderAdmin(){
    const items=adminItems();
    rows.innerHTML="";
    if(!items.length){
      rows.innerHTML='<div class="admin-status">Nessun elemento in questa categoria.</div>';
      return;
    }
    items.forEach((item,i)=>{
      const name=pick(item,["name","title","channel","nome"])||"";
      const url=pick(item,["url","stream","src","link","m3u8"])||"";
      const div=document.createElement("div");
      div.className="admin-row";
      div.innerHTML='<input class="aname" placeholder="Nome canale/contenuto"><input class="aurl" placeholder="URL stream o contenuto"><button class="btn" title="Elimina">✕</button>';
      div.querySelector(".aname").value=name;
      div.querySelector(".aurl").value=url;
      div.querySelector("button").onclick=()=>{items.splice(i,1);renderAdmin()};
      rows.appendChild(div);
    });
  }
  function openAdmin(){panel.classList.add("open")}
  document.getElementById("adminBtn").onclick=openAdmin;
  document.getElementById("adminClose").onclick=()=>panel.classList.remove("open");
  panel.onclick=e=>{if(e.target===panel)panel.classList.remove("open")};

  document.getElementById("adminLoginBtn").onclick=()=>{
    if(document.getElementById("adminPassword").value===ADMIN_PASSWORD){
      adminLogged=true;
      document.getElementById("adminLogin").style.display="none";
      document.getElementById("adminEditor").style.display="block";
      renderAdmin();
    }else alert("Password non corretta.");
  };
  cat.onchange=renderAdmin;

  document.getElementById("adminAdd").onclick=()=>{
    const x=DEFAULT_DATA[cat.value];
    if(Array.isArray(x)) x.push({name:"Nuovo canale",url:""});
    else if(x && typeof x==="object") x["new_"+Date.now()]={name:"Nuovo canale",url:""};
    else DEFAULT_DATA[cat.value]=[{name:"Nuovo canale",url:""}];
    renderAdmin();
  };

  document.getElementById("adminSave").onclick=async()=>{
    if(!adminLogged)return;
    const items=adminItems();
    const newItems=[];
    document.querySelectorAll(".admin-row").forEach(r=>{
      newItems.push({name:r.querySelector(".aname").value.trim(),url:r.querySelector(".aurl").value.trim()});
    });
    DEFAULT_DATA[cat.value]=newItems;
    status.textContent="Modifiche applicate.";
    renderLive();
    try{
      if(window.__ILREGNO_FB?.db){
        await window.__ILREGNO_FB.set(window.__ILREGNO_FB.ref(window.__ILREGNO_FB.db,"data"),DEFAULT_DATA);
        status.textContent="Modifiche salvate su Firebase.";
      }
    }catch(e){
      status.textContent="Modifiche applicate localmente. Firebase non disponibile.";
    }
  };
})();
</script>
