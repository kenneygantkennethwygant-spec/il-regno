<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Il Regno</title>
<link rel="preconnect" href="https://il-regno-app-default-rtdb.europe-west1.firebasedatabase.app" crossorigin>
<style>
/* Il Regno: pagina per la Fire TV Stick (Muflone, 960x540 CSS). Aspetto dalla bozza «R-sfondo-1».
   Pulsanti alti almeno 64 px; testo almeno 12 px salvo «LIVE», 3 px sotto la scritta più piccola; niente scorrimento orizzontale.
   Scritte: 24 logo, 17 titolo del lettore, 16 pillole, 15 nomi e pulsanti, 14 in onda, 13 programma e orari, 12 non disponibile, 9 LIVE. */
:root{--bg:#07080b;--panel:#101217;--card:#0d0f14;--plate:#181b22;--text:#f6f7f9;--muted:#a3a6b2;
  --red:#ff3048;--yel:#ffc531;--line:rgba(255,255,255,.10);--gut:24px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.2 Roboto,system-ui,sans-serif;overflow-x:hidden}
body.pl{overflow:hidden}
/* sfondo «Luci»: aloni fermi su uno strato fisso, così non si ridisegnano mentre la pagina scorre */
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(ellipse 70% 55% at 8% 0%,rgba(255,48,72,.22),transparent 70%),radial-gradient(ellipse 60% 50% at 100% 100%,rgba(140,20,60,.30),transparent 70%),radial-gradient(ellipse 50% 40% at 85% 10%,rgba(90,40,160,.16),transparent 70%),linear-gradient(180deg,#0b0a10,#07080b)}
button{font:inherit;color:inherit;cursor:pointer;margin:0}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}

/* barra alta: logo, recenti, cerca, admin */
.top{display:flex;align-items:center;gap:14px;padding:2px var(--gut) 0;height:66px}
.logo{font-size:24px;font-weight:900;letter-spacing:.5px;white-space:nowrap}
.logo span{color:var(--red)}
.recenti{display:flex;align-items:center;gap:10px;flex:1 1 0;min-width:0}
.lbl{color:var(--muted);font-size:14px}
.chip{height:64px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:15px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.chip.sito::after{content:" \2197";color:var(--muted);font-weight:400}
.cerca{height:64px;width:140px;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 16px;border-radius:14px;
  border:1px solid rgba(255,255,255,.18);background:#0b0c10;color:var(--muted);font-size:15px;margin-left:auto}
.ricerca{display:flex;flex:1 1 0;min-width:0;gap:10px}
.ricerca input{flex:1 1 0;min-width:0;height:64px;padding:0 18px;border-radius:14px;border:1px solid var(--red);background:#0b0c10;
  color:var(--text);font:inherit;font-size:17px}
.ricerca button{flex:0 0 64px;height:64px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-size:20px}
.admin{height:64px;padding:0 12px;display:flex;align-items:center;color:#6f7280;font-size:14px;border-radius:12px;flex:0 0 auto}

/* pillole delle categorie */
/* le pillole stanno a metà tra la barra alta e il primo gruppo (38 px sopra e sotto) */
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:38px var(--gut) 34px}
.pill{height:64px;border-radius:999px;border:1px solid var(--line);background:#11131a;color:#e4e6eb;font-size:16px;font-weight:800;
  display:flex;align-items:center;justify-content:center;white-space:nowrap}
.pill.on{background:var(--red);border-color:var(--red);color:#fff}
/* il pallino compare solo quando stato.json ha risposto (o è mancato): finché non si sa, il posto è vuoto e il verde non si afferma */
.stato,.sp{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.stato.ok{background:#2fd06b;box-shadow:0 0 0 3px rgba(47,208,107,.18)}
.stato.ko{background:var(--yel);box-shadow:0 0 0 3px rgba(255,197,49,.18)}

/* scelta del sito (categoria con più siti): strato sopra la pagina, un pulsante grande per sito */
#scelta{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(7,8,11,.9)}
.sc{display:flex;flex-direction:column;gap:14px;width:min(460px,100% - 48px)}
#scLista{display:flex;flex-direction:column;gap:14px}
.sc p{margin:0 0 4px;font-size:19px;font-weight:800}
.sc button{height:64px;display:flex;align-items:center;padding:0 22px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-size:18px;font-weight:700}
.sc button:hover{border-color:rgba(255,48,72,.6)}
.sc .sito::after{content:"\2197";margin-left:auto;color:var(--muted);font-weight:400}

/* gruppi e schede dei canali */
.gruppi{padding:0 var(--gut)}
.gruppo{padding-top:4px}
.gruppo h2{display:flex;align-items:center;gap:10px;margin:0 0 4px;font-size:15px;line-height:24px;font-weight:800}
.gruppo h2::before{content:"";width:4px;height:18px;background:var(--red);border-radius:2px}
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr));gap:5px 10px}
.ch{content-visibility:auto;contain-intrinsic-size:auto 210px auto 64px;height:64px;display:flex;align-items:center;gap:10px;padding:0 8px 0 4px;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:14px;min-width:0}
/* le schede fuori schermo non si disegnano (content-visibility); la misura è quella vera della scheda, così la pagina non salta */
/* targa: il logo, o la sigla se manca */
.plate{flex:0 0 auto;width:58px;height:54px;border-radius:10px;background:var(--plate);display:flex;align-items:center;
  justify-content:center;font-weight:900;color:#fff;letter-spacing:-.3px;line-height:1}
.plate.s1{font-size:28px}.plate.s3{font-size:20px}.plate.s4{font-size:17px}.plate.s5{font-size:16px;letter-spacing:-.6px}
.plate img{display:none;width:50px;height:46px;object-fit:contain}
.plate.ok img{display:block}
.info{display:flex;flex-direction:column;min-width:0;line-height:1.15}
/* il nome del canale sta sempre intero su una riga */
.info b,.live{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info b{font-size:15px;font-weight:700}
.live{font-size:12px;font-weight:600;color:var(--red)}
.ch:not(.off) .live{font-size:9px;letter-spacing:.4px}
/* programma in onda: al massimo due righe, poi «…» (scelta di Lorenzo, 18/10, per i titoli lunghi) */
.prog{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.prog:empty{display:none}
/* canale segnalato come non funzionante: scheda gialla, ma si può cliccare lo stesso */
.ch.off{background:transparent;border-style:dashed;border-color:rgba(255,197,49,.5)}
.ch.off .plate{background:#121318;color:#8a7a4a}
.ch.off b{color:#c9c2a8}
.ch.off .live{color:var(--yel)}
.sk{height:64px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.msg{padding:12px var(--gut);font-size:16px;color:var(--muted)}
.fondo{display:flex;justify-content:center;padding:8px 0 24px}
.su{height:64px;padding:0 26px;border-radius:999px;border:1px solid var(--line);background:#11131a;font-size:15px;font-weight:600}
.chip:hover,.pill:hover,.ch:hover,.su:hover,.cerca:hover{border-color:rgba(255,48,72,.6)}
.ch.off:hover{border-color:var(--yel)}
.admin:hover{color:#c9ccd4}

/* lettore: strato a tutto schermo, senza angoli arrotondati né ritagli attorno al video.
   --margine-lato: scritte e comandi dai lati (foro della fotocamera del telefono, 36,6 px, più respiro); da regolare sul telefono */
#modal{--margine-lato:48px;display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:9999}
#modal.open{display:block}
/* lettore aperto: nella finestrella del telefono la pagina più larga farebbe rimpicciolire tutto, video in un angolo */
html.pl,html.pl body{overflow-x:hidden}
#video{position:absolute;top:0;left:0;width:100%;height:100%;background:#000;object-fit:contain}
.barra{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:8px var(--margine-lato);pointer-events:none}
.nome{flex:1 1 0;min-width:0;padding-top:4px}
.barra strong{font-size:17px;font-weight:700;text-shadow:0 2px 6px #000}
/* in onda ora (R16): riga sotto il nome, senza riquadro, e barretta di avanzamento; spariscono con la barra */
#inonda{margin-top:3px;font-size:14px;font-weight:500;color:rgba(255,255,255,.8);text-shadow:0 0 4px #000,0 2px 6px #000;white-space:pre;overflow:hidden;text-overflow:ellipsis}
#avanza{width:200px;max-width:100%;height:3px;margin-top:8px;border-radius:2px;background:rgba(255,255,255,.2);overflow:hidden}
#avanza i{display:block;height:100%;width:0;background:var(--red)}
/* titolo, X e comandi spariscono come il puntatore di Muflone (3 s senza movimento) con la sola opacità: l'elemento resta nella pagina,
   perché Indietro di Muflone esegue closePlayer.click() anche a controlli nascosti; nascosti non prendono i clic.
   Il pannello d'errore non si nasconde mai, e con lui restano i controlli. */
.barra,.cmd,#tempo,#audioScelte{transition:opacity .2s}
#modal.nasc:not(.errore) .barra,#modal.nasc:not(.errore) .cmd,#modal.nasc:not(.errore) #tempo,#modal.nasc:not(.errore) #audioScelte{opacity:0}
#modal.nasc:not(.errore) #closePlayer,#modal.nasc:not(.errore) .cmd,#modal.nasc:not(.errore) #linea{pointer-events:none}
/* in pausa «In diretta» non sparisce con gli altri comandi */
#modal.nasc.inpausa:not(.errore) #diretta{opacity:1;pointer-events:auto}
#closePlayer{flex:none;pointer-events:auto;width:64px;height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.6);font-size:22px}
/* lettore aperto: niente si ridisegna dietro (sulla chiavetta il ridisegno sotto il video fa fermare hls.js) */
body.pl>:not(#modal){visibility:hidden}body.pl::before{display:none}
.cmd{flex:none;max-width:100%;height:64px;padding:0 20px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.6);
  font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:auto}
/* «Audio: …» prima della X, la scelta sotto */
#audio{min-width:0;flex:0 1 auto}
#audioScelte{position:absolute;top:80px;right:var(--margine-lato);z-index:3;display:flex;flex-direction:column;gap:6px;padding:6px;min-width:250px;border-radius:20px;border:1px solid var(--line);background:rgba(12,13,18,.94)}
#audioScelte .cmd{display:flex;align-items:center;gap:12px;border-color:transparent;background:transparent;text-align:left}
#audioScelte .cmd::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;border:2px solid rgba(255,255,255,.5)}
#audioScelte [aria-pressed=true]::before{background:var(--red);border-color:var(--red)}
/* in basso: linea del tempo e comandi; i clic passano al video salvo sui comandi */
#basso{position:absolute;left:var(--margine-lato);right:var(--margine-lato);bottom:var(--gut);z-index:2;display:flex;flex-direction:column;pointer-events:none}
.riga{display:flex;align-items:center;flex-wrap:wrap;gap:12px}
#pausa{width:64px;padding:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.92);border-color:transparent;color:#07080b}
#pausa svg{width:26px;height:26px;fill:currentColor}
#modal:not(.inpausa) #pausa .i-riprendi,#modal.inpausa #pausa .i-pausa{display:none}
.tondo{min-width:64px;padding:0 14px}
#diretta{margin-left:auto;background:var(--red);border-color:var(--red)}
/* V5: linea del programma; tutta la linea (64 px) prende il clic */
#tempo{display:flex;align-items:center;gap:14px;margin-bottom:6px}
#lineaInizio,#lineaFine,#ritardo{flex:none;font-size:13px;font-weight:600;text-shadow:0 0 4px #000,0 2px 6px #000}
#linea{position:relative;flex:1 1 0;min-width:0;height:64px;cursor:pointer;pointer-events:auto}
#linea .binario{position:absolute;left:0;right:0;top:41px;height:5px;border-radius:3px;background:rgba(255,255,255,.22)}
#linea i{position:absolute;top:0;bottom:0;border-radius:3px}
#rivedibile{background:rgba(255,255,255,.45)}
#visto{background:var(--red)}
.binario #vivo{top:-6px;width:3px;height:17px;margin-left:-1.5px;border-radius:2px;background:var(--red)}
.binario #punto{top:-7px;width:19px;height:19px;margin-left:-9.5px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.6)}
#ritardo{position:absolute;top:10px;transform:translateX(-50%);white-space:nowrap}
#ritardo.vivo{color:#ff6b7c}
/* «In pausa» e «Riconnessione…» al centro del video, senza prendere i clic */
#inpausa,#riconnessione,#lenta{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:10px 24px;border-radius:999px;background:rgba(0,0,0,.6);
  font-size:20px;font-weight:700;white-space:nowrap;pointer-events:none}
#riconnessione,#lenta{font-size:16px;font-weight:600}
#err{display:none;position:absolute;top:0;left:0;right:0;bottom:0;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  background:#000;text-align:center;padding:0 var(--gut)}
#modal.errore #err{display:flex}
#modal.errore #video{visibility:hidden}
#err p{margin:0;font-size:22px;font-weight:700}
#err #errcod{margin-top:-12px;font-size:15px;font-weight:500;color:var(--muted)}
#err #errcod:empty{display:none}
#modal.errore #pausa,#modal.errore #audio,#modal.errore #audioScelte,#modal.errore #diretta,#modal.errore #inpausa,#modal.errore #riconnessione,#modal.errore #lenta,
#modal.errore #tempo,#modal.errore #ricomincia,#modal.errore #indietro30,#modal.errore #avanti30{display:none}
#err div{display:flex;gap:16px}
#err button{height:64px;min-width:160px;padding:0 28px;border-radius:999px;border:1px solid var(--line);background:#11131a;font-size:17px;font-weight:700}
#err #riprova{background:var(--red);border-color:var(--red)}

/* schermi stretti (telefono): le righe vanno a capo */
@media(max-width:700px){
  .top{height:auto;flex-wrap:wrap;padding-top:8px}
  .recenti{flex:1 1 100%;order:3;flex-wrap:wrap}
  .cats{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
  .cmd{padding:0 14px}
  .riga{gap:8px}
}
</style>
</head>
<body>
<header class="top">
  <div class="logo">IL <span>REGNO</span></div>
  <nav class="recenti" id="recenti" aria-label="Aperti di recente" hidden></nav>
  <button class="cerca" id="cerca">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ff3048" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    Cerca
  </button>
  <div class="ricerca" id="ricerca" hidden>
    <input id="q" type="text" placeholder="Cerca un canale" autocomplete="off" enterkeyhint="search" aria-label="Cerca un canale">
    <button id="chiudiRicerca" aria-label="Esci dalla ricerca">&#10005;</button>
  </div>
  <a class="admin" href="admin.html">Admin</a>
</header>

<nav class="cats" aria-label="Categorie">
  <button class="pill on" id="live">Live TV</button>
  <button class="pill" data-sito="film"><i class="sp"></i>Film</button>
  <button class="pill" data-sito="serie"><i class="sp"></i>Serie TV</button>
  <button class="pill" data-sito="sport"><i class="sp"></i>Sport</button>
  <button class="pill" data-sito="anime"><i class="sp"></i>Anime</button>
</nav>

<div id="scelta" hidden role="dialog" aria-label="Scegli il sito"><div class="sc"><p id="scTit">Scegli il sito</p><div id="scLista"></div><button id="scChiudi">Chiudi</button></div></div>
<div class="msg" id="avviso" hidden></div>
<main class="gruppi" id="gruppi"><section class="gruppo"><div class="griglia"><i class="sk"></i><i class="sk"></i><i class="sk"></i><i class="sk"></i><i class="sk"></i><i class="sk"></i><i class="sk"></i><i class="sk"></i></div></section></main>
<div class="fondo"><button class="su" id="su">&#8593; Torna in cima</button></div>

<div id="modal">
  <video id="video" playsinline></video>
  <div class="barra"><div class="nome"><strong id="titolo"></strong><div id="inonda" hidden></div><div id="avanza" hidden><i></i></div></div><button class="cmd" id="audio" hidden></button><button id="closePlayer" aria-label="Esci">&#10005;</button></div>
  <div id="audioScelte" hidden></div>
  <div id="inpausa" hidden>In pausa</div>
  <div id="riconnessione" hidden>Riconnessione&hellip;</div>
  <div id="lenta" hidden>Linea lenta, sto caricando&hellip;</div>
  <div id="basso">
    <div id="tempo" hidden><span id="lineaInizio"></span><div id="linea"><span id="ritardo"></span><div class="binario"><i id="rivedibile"></i><i id="visto"></i><i id="vivo"></i><i id="punto"></i></div></div><span id="lineaFine"></span></div>
    <div class="riga">
<button class="cmd" id="ricomincia" hidden>Ricomincia</button><button class="cmd tondo" id="indietro30" hidden>&minus;30 s</button><button class="cmd" id="pausa" aria-label="Pausa"><svg class="i-pausa" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg><svg class="i-riprendi" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg></button><button class="cmd tondo" id="avanti30" hidden>+30 s</button><button class="cmd" id="diretta" hidden>In diretta</button>
    </div>
  </div>
  <div id="err"><p id="errmsg"></p><p id="errcod"></p><div><button id="riprova">Riprova</button><button id="chiudi">Chiudi</button></div></div>
</div>

<script>
// Dati: una sola richiesta REST a Firebase; l'ultima copia buona resta sul dispositivo e si disegna subito.
const DB="https://il-regno-app-default-rtdb.europe-west1.firebasedatabase.app/v2.json";
const $=s=>document.querySelector(s);
const MESI="gennaio febbraio marzo aprile maggio giugno luglio agosto settembre ottobre novembre dicembre".split(" ");
const arr=x=>Array.isArray(x)?x.filter(Boolean):x?Object.values(x):[];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// le WebView vecchie (Android 11 non aggiornato) non hanno AbortSignal.timeout
const scade=ms=>{
  if(AbortSignal.timeout)return AbortSignal.timeout(ms);
  const c=new AbortController(); setTimeout(()=>c.abort(),ms); return c.signal;
};
const mem={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};
let D=null, STATO={}, ST={}, GUIDA={}, secondari=false, statoNoto=false;

// ---------- copia sul dispositivo ----------
function leggiCache(){
  try{
    const o=JSON.parse(mem.get("ilregno.v2")), v=o.canali?o:Object.values(o).find(x=>x&&x.canali);
    const d=new Date(o.d||o.data||o.ts||o.date||0);   // forma scritta da salvaCache; il resto per tolleranza
    return v?{v,d:isNaN(d)?null:d}:null;
  }catch(e){return null}
}
const salvaCache=v=>mem.set("ilregno.v2",JSON.stringify({d:new Date().toISOString(),v}));

// ---------- programma in onda (guida), adesso o all'ora n ----------
function programma(c,n=Date.now()){
  const l=arr(GUIDA.canali&&GUIDA.canali[c.epg||c.id]);
  // le voci possono sovrapporsi (21:20 inizia prima che finisca il programma delle 20:39): in onda è quella partita per ultima
  let ora;
  l.forEach(p=>{
    const i=Date.parse(p.i), f=Date.parse(p.f);
    if(i<=n&&n<f&&(!ora||i>Date.parse(ora.i)))ora=p;
  });
  return ora;
}

// ---------- disegno ----------
function scheda(c){
  const n=(c.sigla||"").length, z=n<=2?"s1":"s"+Math.min(n,5);
  return `<button class="ch" data-t="canale" data-i="${esc(c.id)}"><span class="plate ${z}">`+
    `<img data-src="loghi/${esc(c.id)}.webp" width="50" height="46" alt=""><span class="sg">${esc(c.sigla||"")}</span></span>`+
    `<span class="info"><b>${esc(c.nome)}</b><span class="live">&#9679; LIVE</span><span class="prog"></span></span></button>`;
}
function disegna(){
  const q=$("#q").value.trim().toLowerCase();
  const gr=[...D.gruppi];
  D.canali.forEach(c=>{c.gruppo=c.gruppo||"Altri"; if(!gr.includes(c.gruppo))gr.push(c.gruppo)});
  let h="", n=0;
  gr.forEach(g=>{
    const l=D.canali.filter(c=>c.gruppo===g&&(!q||String(c.nome).toLowerCase().includes(q)));
    if(!l.length)return;
    n+=l.length;
    h+=`<section class="gruppo"><h2>${esc(g)}</h2><div class="griglia">${l.map(scheda).join("")}</div></section>`;
  });
  $("#gruppi").innerHTML=n?h:'<div class="msg" style="padding-left:0">Nessun canale trovato</div>';

}
// stato dei link e programma in onda: si applicano sulle schede già disegnate; ogni minuto si scrive solo ciò che è cambiato
function aggiorna(){
  if(window.unisci)unisci();
  if(statoNoto)document.querySelectorAll("[data-sito]").forEach(el=>{
    // la pillola è verde se almeno uno dei suoi siti è ok
    const ko=sitiDi(el.dataset.sito).every(x=>((STATO.siti||{})[x.id]||{}).ok===false);
    const p=el.firstElementChild, cl="stato "+(ko?"ko":"ok");

const scrivi=(el,t)=>{if(el.textContent!==t)el.textContent=t};
// logo: si chiede solo quando la scheda è nella schermata o vicina (200 px); finché non arriva si vede la sigla, e se manca resta la sigla
const vista=window.IntersectionObserver&&new IntersectionObserver(l=>l.forEach(o=>{

function caricaLogo(el){

addEventListener("error",e=>{

// ---------- recenti (ultime 3 cose aperte) ----------
const trova=(tipo,id)=>D&&(tipo==="sito"?D.siti:D.canali).find(x=>x.id===id);
function leggiRecenti(){try{return JSON.parse(mem.get("ilregno.recenti"))||[]}catch(e){return[]}}
function recenti(){
  const v=leggiRecenti().map(x=>({x,o:trova(x.tipo,x.id)})).filter(a=>a.o), el=$("#recenti");
  el.innerHTML=v.length?'<span class="lbl">Recenti</span>'+v.map(a=>
    `<button class="chip ${a.x.tipo}" data-t="${a.x.tipo}" data-i="${esc(a.x.id)}">${esc(a.o.nome)}</button>`).join(""):"";

// i siti di una categoria (pillola): quelli con "pillola" uguale, o senza "pillola" e con quell'id
const sitiDi=cat=>D?D.siti.filter(x=>(x.pillola||x.id)===cat):[{id:cat}];
function categoria(cat){
  const l=sitiDi(cat);
  if(l.length>1)scelta(cat,l);
  else if(l.length)apri("sito",l[0].id);
}
// Indietro di Muflone chiude la scelta come la ricerca: una voce di cronologia in più, tolta se la scelta si chiude in altro modo
// o prima di aprire il sito, così dal sito si torna a Il Regno senza un Indietro a vuoto
let voceScelta=false, attesa=0, vaA=null;
function scelta(cat,l){
  const nome=$(`[data-sito="${cat}"]`).textContent.trim();
  $("#scTit").textContent=nome;
  $("#scLista").innerHTML=l.map(x=>`<button class="sito" data-t="sito" data-i="${esc(x.id)}"><i class="stato ${((STATO.siti||{})[x.id]||{}).ok===false?"ko":"ok"}"></i>${esc(x.nome)}</button>`).join("");
  $("#scelta").hidden=false; $("#scLista button").focus();

}
function chiudiScelta(dalBack){
  if(!voceScelta)return;
  $("#scelta").hidden=true; voceScelta=false;
  if(!dalBack){attesa++; history.back()}
}
// apre il sito in questa schermata; con la scelta aperta prima toglie la sua voce di cronologia
function vai(url){
  if(!voceScelta)return void(location.href=url);
  vaA=url; chiudiScelta(false); setTimeout(vaPoi,500);
}
function vaPoi(){if(vaA){const u=vaA;vaA=null;location.href=u}}
function apri(tipo,id){
  const o=trova(tipo,id); if(!o)return;
  mem.set("ilregno.recenti",JSON.stringify([{tipo,id},...leggiRecenti().filter(x=>!(x.tipo===tipo&&x.id===id))].slice(0,3)));
  recenti();
  if(tipo==="canale")riproduci(o);
  else if(o.url)vai(indirizzo(o));
}
// il controllo notturno può aver trovato che il vecchio indirizzo rimanda da sé al nuovo: vale solo se i dati hanno ancora esattamente quello
function indirizzo(o){
  const s=(STATO.siti||{})[o.id];
  return s&&s.nuovo&&s.sostituisce===o.url?s.nuovo:o.url;
}

// ---------- lettore ----------
const M=$("#modal"), V=$("#video");
let tok=0, hls=null, tm=[], cur=null, pos=0, rai=null, nrai=0;
// cosa si sa del canale aperto (si azzera a ogni apertura, cambio e chiusura): avviato = ha mostrato la prima immagine,
// ricon = sta riconnettendosi, lunga = la pausa è durata 30 s
let avviato=false, ricon=false, lunga=false, trc=[], tp=0, vg=0;
// riconnessione: finiti = passati i 15 s dei tentativi, provv = istante del video da cui l'immagine va di nuovo (provvisorio finché non passano 10 s);
// vigilato e fermi = ultimo istante visto dal controllo di ogni secondo e quanti secondi di fila è uguale
let finiti=false, provv=null, vigilato=null, fermi=0;
// daHls = il canale suona con hls.js (Rai, o nativo non riuscito): i tentativi usano lo stesso lettore; traccia = audio scelto dallo spettatore
let daHls=false, traccia="";
// ultimi pezzi ricevuti: qualsiasi, e di video
let dato=0, pezzo=0;
// voluta = ultima cosa vista sul video è una pausa data da qualcuno (non un errore né la fine): gli errori durante la pausa non sono cadute
let voluta=false;
const entro=(f,ms)=>tm.push(setTimeout(f,ms));
// ferma il flusso (lo fa anche ogni tentativo di riconnessione)
function fermaFlusso(){
  tok++; tm.forEach(clearTimeout); tm=[]; rai=null;
  V.onerror=V.onplaying=null;
  if(hls){hls.destroy();hls=null}
  V.pause(); V.removeAttribute("src"); V.load();
  vigilato=ultimo=null; fermi=0;
  aggiornaAudio();
}
// ferma tutto del canale aperto: flusso, riconnessione, pausa
function ferma(){
  fermaFlusso();
  avviato=ricon=lunga=finiti=daHls=voluta=false; provv=null; traccia="";
  trc.forEach(clearTimeout); trc=[]; clearTimeout(tp); clearInterval(vg);
  $("#riconnessione").hidden=$("#diretta").hidden=$("#lenta").hidden=true; aggiornaPausa();
  clearInterval(tt); senzaTempo();
}
function chiudiLettore(){
  ferma(); M.className=""; clearTimeout(tb);
  document.body.classList.remove("pl"); document.documentElement.classList.remove("pl"); clearInterval(ti);
  if(scrollY!==pos)scrollTo(0,pos);
}
// V01 manca l'indirizzo o hls.js non parte, V02 8 s senza pezzi o errore del video, V03 indirizzo Rai non ottenuto,
// V04 indirizzo Sky non ottenuto, V05 partito ma caduto e tre riconnessioni riuscite a vuoto
function fallito(k,cod){
  if(k!==tok||ricon)return;   // durante la riconnessione il fallimento di un tentativo non si mostra
  ferma(); console.warn("lettore",cur.id,cod);
  $("#errmsg").textContent=cod==="V05"?`${cur.nome} non risponde`:`${cur.nome} non disponibile ora (codice ${cod})`;
  $("#errcod").textContent=cod==="V05"?`Ho riprovato 3 volte (codice ${cod})`:"";
  M.classList.add("errore"); $("#riprova").focus();
}
function riproduci(c){
  if(!M.classList.contains("open"))pos=scrollY;
  ferma(); cur=c;
  M.className="open"; document.body.classList.add("pl"); document.documentElement.classList.add("pl"); mostraBarra(true);
  $("#titolo").textContent=c.nome;
  inOnda(c); clearInterval(ti); ti=setInterval(()=>inOnda(c),60000);
  tt=setInterval(()=>{if(!M.classList.contains("nasc")||M.classList.contains("inpausa"))aggiornaTempo()},1000);   // la linea si ridisegna solo se si vede, o in pausa per «In diretta»
  apriFlusso(c);
}
// chiede il flusso del canale e aspetta la prima immagine
function apriFlusso(c){
  const k=tok;
  V.onplaying=()=>{if(k===tok){V.onplaying=null;ricon?ripreso(k):partito(k)}};   // solo la prima partenza, non dopo ogni scatto
  if(c.sky)return chiediSky(c,k);
  if(!c.url)return fallito(k,"V01");
  if(c.rai)return chiediRai(c,k);
  aspettaDati(k);
  if(SEMPRE_HLS.includes(c.id)||MS.test(c.url))return suHls(c.url,k);
  suona(c.url,k);
}
// V02 dopo 8 s senza pezzi (40 in tutto), «Linea lenta…» dopo 10 s senza immagine
function aspettaDati(k){
  const t0=Date.now(); dato=0;
  (function giro(){
    const ora=Date.now(), n=ora-t0;
    if(ora-(dato||t0)>=8e3||n>=4e4)return fallito(k,"V02");
    $("#lenta").hidden=n<1e4||ricon;
    entro(giro,500);
  })();
}
// canale normale: prima il lettore nativo, se non sa leggere il flusso o non avanza si riprova una volta con hls.js
function suona(url,k){
  if(daHls)return suHls(url,k);   // una riapertura resta sul lettore che suonava: il nativo potrebbe non leggerlo
  let usato=false;
  const conHls=()=>{if(usato||k!==tok)return;usato=true;V.removeAttribute("src");V.load();suHls(url,k)};
  V.onerror=conHls;
  entro(conHls,6000);
  V.src=url; V.play().catch(()=>{});
}
// Sky: l'indirizzo ha un gettone di 5 minuti: lo si chiede all'API pubblica di Sky a ogni apertura e si suona come un canale normale
function chiediSky(c,k){
  fetch("https://video.sky.it/api/v1/getLivestream?id="+encodeURIComponent(c.sky)+"&isMobile=false",{signal:scade(15000)})
    .then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{
      if(k!==tok)return;
      if(!(j&&typeof j.streaming_url==="string"&&j.streaming_url))throw 0;
      aspettaDati(k); suona(j.streaming_url,k);
    }).catch(()=>fallito(k,"V04"));
}
// titolo, X e comandi: visibili all'apertura e a ogni movimento o clic, spariscono 3 s dopo l'ultimo (come il puntatore di Muflone).
// Nascosti non prendono il clic; col dito però il clic cade dopo che la pressione li ha già rimessi: quel clic si scarta.
// Il clic da programma, come l'Indietro di Muflone, passa sempre.
let tb=0, ti=0, tocco=false;
const nascosti=()=>M.classList.contains("nasc")&&!M.classList.contains("errore");
M.addEventListener("pointerdown",()=>{tocco=nascosti()},true);
M.addEventListener("click",e=>{if(tocco&&e.isTrusted){e.stopPropagation();e.preventDefault()} tocco=false},true);
// in onda: «HH:MM – HH:MM  Titolo» e quanto ne è passato; senza guida niente
function inOnda(c){
  const p=programma(c), ok=!!p;
  $("#inonda").hidden=$("#avanza").hidden=!ok;
  if(!ok)return;
  const i=Date.parse(p.i), f=Date.parse(p.f);
  $("#inonda").textContent=p.i.slice(11,16)+" – "+p.f.slice(11,16)+"  "+p.t;
  $("#avanza i").style.width=Math.max(0,Math.min(100,(Date.now()-i)/(f-i)*100)).toFixed(1)+"%";
}
function mostraBarra(forza){
  if(!forza&&!M.classList.contains("open"))return;
  const nasc=M.classList.contains("nasc");
  M.classList.remove("nasc"); clearTimeout(tb);
  if(nasc)aggiornaTempo();
  tb=setTimeout(()=>M.classList.add("nasc"),3000);
}
["mousemove","pointermove","pointerdown","click"].forEach(t=>M.addEventListener(t,()=>mostraBarra()));
// il video è partito: si fermano i controlli di tempo dell'apertura
function partito(k){
  tm.forEach(clearTimeout); tm=[]; $("#lenta").hidden=true;
  avviato=true; V.onerror=()=>guasto(k); vigila(); aggiornaPausa(); aggiornaTempo();
}
// pausa: «In pausa» resta sullo schermo finché dura, chiunque l'abbia data (anche il tasto Play/Pausa di Muflone, che ferma il video);
// dopo 30 s compare «In diretta» e resta fino a che non si usa, si cambia canale o si chiude. Non è una pausa mentre il canale
// si apre, si cambia o si riconnette, né alla fine di un video.
function aggiornaPausa(){
  const p=avviato&&!ricon&&V.paused&&!V.ended&&!M.classList.contains("errore");
  if(p===M.classList.contains("inpausa"))return;
  M.classList.toggle("inpausa",p); $("#inpausa").hidden=!p;
  $("#pausa").setAttribute("aria-label",p?"Riprendi":"Pausa");
  clearTimeout(tp);
  if(p)tp=setTimeout(()=>{lunga=true; $("#diretta").hidden=false},30000);
}
["play","pause","playing","ended"].forEach(t=>V.addEventListener(t,aggiornaPausa));
V.addEventListener("play",()=>voluta=false);
V.addEventListener("pause",()=>voluta=!V.ended&&!V.error);
// Un canale dal vivo che smette di rispondere congela l'immagine senza errore. Dopo la prima immagine, ogni secondo si guarda se il
// video non in pausa avanza; fermo per 6 s è una caduta, come un errore del video o di hls.js.
function vigila(){
  clearInterval(vg);
  vg=setInterval(()=>{
    const t=V.currentTime, prima=vigilato;
    vigilato=t;
    // uno spostamento nel tempo non è una caduta, fino a 15 s
    if(V.paused||V.ended||prima===null||V.seeking&&Date.now()-salto<15000){fermi=0; return}
    if(t!==prima){fermi=0; if(ricon)provvisorio(t); return}
    if(++fermi>=6&&Date.now()-pezzo>3000){fermi=0; cade(tok)}
  },1000);
}
const guasto=k=>avviato?cade(k):fallito(k,"V02");
// caduta: «Riconnessione…» e il flusso riaperto da capo a 0, 5 e 10 s (per Rai un indirizzo nuovo ogni volta: il gettone scade).
// Una riapertura riuscita non basta: si conferma solo se il video avanza di 10 s senza fermarsi (un canale bloccato a monte rimette
// in onda per pochi secondi i pezzi che ha). Dopo 15 s, o appena si ferma di nuovo, senza conferma: pannello V05; in ogni caso entro 35 s.
// Una pausa voluta non è una caduta, nemmeno se hls.js dà errore mentre si è in pausa.
function cade(k){
  if(k!==tok||!avviato)return;
  if(ricon){
    provv=null;
    if(finiti)nonRisponde(); else $("#riconnessione").hidden=false;
    return;
  }
  if(voluta)return;
  ricon=true; finiti=false; provv=null; aggiornaPausa();
  $("#riconnessione").hidden=false;
  trc=[0,5000,10000].map(ms=>setTimeout(()=>{if(provv===null&&!(ms&&dato&&Date.now()-dato<8000)){fermaFlusso(); apriFlusso(cur)}},ms));   // non si riapre se l'immagine va già o arrivano pezzi
  trc.push(setTimeout(()=>{finiti=true; if(provv===null)nonRisponde()},15000), setTimeout(nonRisponde,35000));
}
const nonRisponde=()=>{ricon=false; fallito(tok,"V05")};
// l'immagine va di nuovo: «Riconnessione…» se ne va, la riuscita si conferma dopo 10 s di video
function provvisorio(t){
  if(provv===null){provv=t; $("#riconnessione").hidden=true}
  else if(t-provv>=10){trc.forEach(clearTimeout); trc=[]; ricon=false; provv=null; aggiornaPausa()}
}
// un tentativo ha dato di nuovo l'immagine
function ripreso(k){
  tm.forEach(clearTimeout); tm=[]; V.onerror=()=>guasto(k);
  provvisorio(V.currentTime);
}
// hls.js per la chiavetta (1 GB di RAM, Muflone già in swap): del video già visto se ne tengono 90 s e di quello in anticipo 30 s
// o 30 MB, invece di tutto il visto e 60 MB; parte dalla qualità più bassa (startLevel 0) e sale da sola;
// xhrSetup: «dato» = byte di un pezzo con risposta 2xx
const CONFIG_HLS={backBufferLength:90,maxBufferLength:30,maxMaxBufferLength:30,maxBufferSize:30*1000*1000,startLevel:0,
  xhrSetup:(x,u)=>x.addEventListener("progress",()=>{if(x.status>199&&x.status<300&&!/\.m3u8/.test(x.responseURL||u))dato=Date.now()})};
function suHls(url,k){
  daHls=true;
  const pronto=()=>{
    if(k!==tok)return;
    if(!Hls.isSupported())return fallito(k,"V01");
    hls=new Hls(CONFIG_HLS);
    hls.on(Hls.Events.FRAG_LOADED,(e,d)=>{dato=Date.now(); if(d.frag.type=="main")pezzo=dato});
    hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)guasto(k)});
    hls.on(Hls.Events.AUDIO_TRACKS_UPDATED,riapplicaAudio);
    hls.on(Hls.Events.AUDIO_TRACK_SWITCHED,aggiornaAudio);
    V.onerror=()=>guasto(k);
    hls.attachMedia(V); hls.loadSource(url);
    V.play().catch(()=>{});
  };
  carica("hls.min.js").then(ok=>ok?MS.test(url)?carica("archivio.js").then(pronto):pronto():fallito(k,"V01"));
}
// un solo caricamento per file (0 se manca)
const carica=f=>carica[f]||(carica[f]=new Promise(ok=>{
  const s=document.head.appendChild(document.createElement("script"));
  s.src=f; s.onload=ok; s.onerror=()=>{delete carica[f]; ok(0)};
}));
V.onprogress=()=>{if(!hls)dato=pezzo=Date.now()};
// tracce audio: se il flusso ne offre più d'una (Rai: Italiano, Lingua Originale, Audiodescrizione) «Audio: …» apre la scelta
function aggiornaAudio(){
  const t=hls?hls.audioTracks:[], vari=t.length>1;
  $("#audio").hidden=!vari;
  if(!vari)return void($("#audioScelte").hidden=true);
  const i=hls.audioTrack>=0?hls.audioTrack:Math.max(0,t.findIndex(a=>a.default));
  $("#audio").textContent="Audio: "+t[i].name;
  $("#audioScelte").innerHTML=t.map((a,n)=>`<button class="cmd" data-a="${n}" aria-pressed="${n===i}">${esc(a.name)}</button>`).join("");
}
// dopo una riconnessione l'istanza di hls.js riparte dalla traccia predefinita: si rimette quella scelta
function riapplicaAudio(){
  const n=hls.audioTracks.findIndex(a=>a.name===traccia);
  if(n>=0&&n!==hls.audioTrack)hls.audioTrack=n;
  aggiornaAudio();
}
function scegliAudio(n){
  if(hls){hls.audioTrack=n; traccia=hls.audioTracks[n].name}
  $("#audioScelte").hidden=true;
}
// Rai: l'indirizzo con gettone lo chiede Muflone al momento (risposta in ilRegnoRai); poi lo legge hls.js
function chiediRai(c,k){
  if(!(window.Muflone&&Muflone.risolviRai))return fallito(k,"V03");
  rai=u=>{rai=null;if(u){aspettaDati(k);suHls(u,k)}else fallito(k,"V03")};
  rai.id=String(++nrai);
  entro(()=>{if(rai)fallito(k,"V03")},15000);
  try{Muflone.risolviRai(rai.id,c.url)}catch(e){fallito(k,"V03")}
}
window.ilRegnoRai=(id,u)=>{if(rai&&rai.id===String(id))rai(u)};

// ---------- tempo (V5): indietro e avanti nel programma in onda (misure e trappole in prova-tempo.md) ----------
// Solo con 60 s di spazio vero. Il nativo della chiavetta ignora gli spostamenti: La7, SuperTennis, Radio Italia e Mediaset
// suonano con hls.js. Inizio = primo pezzo + 3 pezzi (seekable parte da 0 e vicino all'inizio hls.js torna in diretta); ritardo da
// liveSyncPosition; ora da PROGRAM-DATE-TIME o, senza (SuperTennis), da adesso. Mai prima dell'inizio del programma che si guarda.
const SEMPRE_HLS=["la7","supertennis","radioitaliatv"], MS=/\.mediaset\.net\/live\//;
let tt=0, salto=0, tempo=null, ultimo=null;   // tempo = capi della linea, mentre i comandi ci sono; ultimo = dove si guardava prima di un salto
V.addEventListener("timeupdate",()=>{if(!V.seeking)ultimo=V.currentTime});
// Un salto che non viene dalla pagina (i tasti ±10 s di Muflone scrivono currentTime) non esce dal programma che si guardava
V.addEventListener("seeking",()=>{
  salto=Date.now(); fermi=0;
  const w=avviato&&!ricon&&ultimo!==null&&finestra(), rif=w&&w.ora(ultimo)+1000;   // +1 s: dopo un salto al limite l'ora cade un soffio prima
  if(w&&V.currentTime<limiti(w,rif).da-0.5)vaiA(-Infinity,0,rif);
});
function finestra(){
  const l=hls&&hls.levels&&hls.levels[hls.currentLevel>=0?hls.currentLevel:0], d=l&&l.details;
  if(!d||!d.live||!d.fragments.length)return null;
  const f=d.fragments.slice(d.vero-d.startSN||0), da=f[0].start, a=f[f.length-1].start+f[f.length-1].duration, g=f[0].programDateTime||0;
  return {f,da,a,min:da+3*d.targetduration,vivo:hls.liveSyncPosition||a-3*d.targetduration,
    ora:p=>g?g+(p-da)*1000:Date.now()-(a-p)*1000, pos:ms=>g?da+(ms-g)/1000:a-(Date.now()-ms)/1000};
}
function limiti(w,ora=w.ora(V.currentTime)){
  const p=programma(cur,ora);
  return {p,da:p?Math.max(w.min,w.pos(Date.parse(p.i))):w.min};
}
function vaiA(t,a,rif){
  const w=finestra(); if(!w)return;
  const da=limiti(w,rif).da, f=a&&w.f.find(x=>x.start+x.duration/2>t);
  t=f&&f.start>=da&&f.start<w.vivo?f.start+.1:Math.min(w.vivo,Math.max(da,t));
  if(Math.abs(t-V.currentTime)>.5)V.currentTime=t; aggiornaTempo();
}
function senzaTempo(){tempo=null; ["#tempo","#ricomincia","#indietro30","#avanti30"].forEach(x=>$(x).hidden=true)}
const oraMin=ms=>new Date(ms).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/Rome"});
const metti=(s,k,v)=>{const e=$(s).style; if(e[k]!==v)e[k]=v};
function aggiornaTempo(){
  const w=avviato&&!ricon&&finestra();
  if(!w||w.vivo-w.min<60){if(tempo){senzaTempo(); if(!lunga)$("#diretta").hidden=true} return}
  const l=limiti(w), t=V.currentTime, dietro=Math.max(0,w.vivo-t), indietro=dietro>=15, ora=w.ora(t), adesso=Date.now();
  // senza guida la linea va dal punto più vecchio alla diretta
  const i=l.p?Date.parse(l.p.i):w.ora(w.min), f=l.p?Date.parse(l.p.f):adesso;
  if(!tempo)mostraBarra();   // arrivano con l'immagine: si vedono 3 s anche dopo un'apertura lenta
  tempo={i,f,w};
  const x=ms=>Math.max(0,Math.min(1,(ms-i)/(f-i||1))), pc=v=>(v*100).toFixed(1)+"%", r=x(Math.max(i,w.ora(w.min))), v=x(adesso), q=x(ora);
  scrivi($("#lineaInizio"),l.p?l.p.i.slice(11,16):oraMin(i)); scrivi($("#lineaFine"),l.p?l.p.f.slice(11,16):oraMin(f));
  metti("#rivedibile","left",pc(r)); metti("#rivedibile","width",pc(v-r));
  metti("#visto","left",pc(r)); metti("#visto","width",pc(Math.max(0,q-r)));
  metti("#vivo","left",pc(v)); metti("#punto","left",pc(q));
  const rit=$("#ritardo");
  scrivi(rit,indietro?`${oraMin(ora)} \u2212${dietro>=60?Math.floor(dietro/60)+" min":Math.round(dietro)+" s"} dalla diretta`:"\u25CF in diretta");
  rit.classList.toggle("vivo",!indietro);
  $("#tempo").hidden=$("#indietro30").hidden=false;
  // la scritta segue il pomello ma non esce dalla linea
  const L=$("#linea").clientWidth, m=rit.offsetWidth/2;
  metti("#ritardo","left",Math.max(m,Math.min(L-m,q*L)).toFixed(1)+"px");
  $("#ricomincia").hidden=!(l.p&&w.pos(i)>=w.min);
  $("#avanti30").hidden=$("#diretta").hidden=!indietro;
}
$("#linea").addEventListener("click",e=>{
  if(!tempo)return;
  const r=$("#linea").getBoundingClientRect();
  vaiA(tempo.w.pos(tempo.i+(e.clientX-r.left)/r.width*(tempo.f-tempo.i)));
});

// ---------- ricerca ----------
// Indietro di Muflone torna alla pagina precedente (non manda Esc): aprendo la ricerca si aggiunge una voce alla cronologia,
// così Indietro la chiude; chiudendola in altro modo (✕, Esc, Live TV) quella voce si toglie, senza lasciare un Indietro a vuoto
let voceRicerca=false;
function ricerca(on,dalBack){
  if(on===!$("#ricerca").hidden)return;
  $("#cerca").hidden=on; $("#ricerca").hidden=!on;
  if(on){$("#q").focus(); if(!voceRicerca){history.pushState(null,"");voceRicerca=true}}
  else{
    $("#q").value="";
    if(voceRicerca){voceRicerca=false; if(!dalBack)history.back()}
  }
  if(D)disegna();
}
addEventListener("popstate",()=>{
  if(attesa){attesa--; vaPoi(); return}
  if(voceScelta)chiudiScelta(true);
  else if(voceRicerca)ricerca(false,true);
});

// ---------- eventi ----------
document.addEventListener("click",e=>{
  if(e.target.id==="scelta")return chiudiScelta();
  const b=e.target.closest("button"); if(!b)return;
  if(b.dataset.t)return apri(b.dataset.t,b.dataset.i);
  if(b.dataset.a)return scegliAudio(+b.dataset.a);
  if(b.dataset.sito)return categoria(b.dataset.sito);
  switch(b.id){
    case "live": if(!$("#ricerca").hidden)ricerca(false); return scrollTo(0,0);
    case "su": return scrollTo(0,0);
    case "cerca": return ricerca(true);
    case "chiudiRicerca": return ricerca(false);
    case "scChiudi": return chiudiScelta();
    case "closePlayer": case "chiudi": return chiudiLettore();
    case "riprova": return riproduci(cur);
    // «In diretta»: sui canali col tempo (V5) ci si sposta al vivo; sugli altri si riapre da capo, come Riprova
    case "diretta": if(tempo){vaiA(Infinity); if(V.paused)V.play().catch(()=>{}); return} return riproduci(cur);
    case "ricomincia": return vaiA(-Infinity);
    case "indietro30": return vaiA(V.currentTime-30,1);
    case "avanti30": return vaiA(V.currentTime+30,1);
    case "pausa": if(avviato)V.paused?V.play().catch(()=>{}):V.pause(); return;
    case "audio": $("#audioScelte").hidden=!$("#audioScelte").hidden; return;
  }
});
$("#q").addEventListener("input",()=>D&&disegna());
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape")return;
  if(voceScelta)chiudiScelta();
  else if(M.classList.contains("open"))chiudiLettore();
  else if(!$("#ricerca").hidden)ricerca(false);
});
addEventListener("pageshow",recenti);   // tornando indietro da un sito
setInterval(aggiorna,60000);            // il programma in onda cambia

// ---------- avvio ----------
function mostra(v){
  D={gruppi:arr(v.gruppi),canali:arr(v.canali),siti:arr(v.siti)};
  $("#avviso").hidden=true; disegna(); dopoPrimaSchermata();
}
// stato dei link e guida si chiedono solo dopo che i canali sono visibili
function dopoPrimaSchermata(){
  if(secondari)return; secondari=true;
  const sj=fetch("stato.json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(s=>{STATO=ST=s}).catch(()=>{});   // senza stato.json: tutti ok (sconosciuto)
  // col ponte di Muflone 0.6 si carica anche ponte.js; i pallini si scrivono quando c'è tutto
  Promise.all([sj,window.Muflone&&Muflone.provaLink?carica("ponte.js"):0]).then(()=>{statoNoto=true;aggiorna()});
  ["hls.min.js","archivio.js"].forEach(carica);
  fetch("guida.json").then(r=>r.json()).then(g=>{GUIDA=g;aggiorna()}).catch(()=>{});
}
const cache=leggiCache(), copia=cache&&JSON.stringify(cache.v);   // prima di mostra(), che cambia i canali
if(cache)mostra(cache.v);
const prendi=n=>fetch(DB,{signal:scade(8000)}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(v=>{
  if(!v||!v.canali)throw 0;
  salvaCache(v); if(JSON.stringify(v)!==copia)mostra(v);   // dati uguali: schede ferme
}).catch(e=>{
  if(!n&&e.name=="TypeError")return setTimeout(prendi,2e3,1);
  console.warn("D01 database non raggiungibile");
  const a=$("#avviso"), d=cache&&cache.d;
  a.textContent="Nessuna connessione"+(d?`: dati del ${d.getDate()} ${MESI[d.getMonth()]}`:"");
  a.hidden=false;
  if(!cache){$("#gruppi").innerHTML=""; dopoPrimaSchermata()}
});
prendi()
