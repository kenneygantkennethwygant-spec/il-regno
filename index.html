<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">

<title>IL REGNO</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --black:#070707;
    --dark:#101010;
    --dark2:#171717;
    --card:#1c1c1c;
    --card2:#242424;
    --red:#e50914;
    --red2:#ff1822;
    --white:#fff;
    --gray:#aaa;
    --green:#46d369;
    --gold:#ffd700;
    --border:#303030;
}

html{
    scroll-behavior:smooth;
}

body{
    background:
        radial-gradient(circle at top,#171717 0,#070707 45%);
    color:var(--white);
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
}

/* =========================
   HEADER
========================= */

.header{
    position:sticky;
    top:0;
    z-index:1000;
    height:72px;

    display:flex;
    align-items:center;
    gap:25px;

    padding:0 28px;

    background:rgba(7,7,7,.94);
    backdrop-filter:blur(15px);

    border-bottom:1px solid rgba(255,255,255,.06);
}

.logo{
    display:flex;
    align-items:center;
    gap:9px;

    font-size:25px;
    font-weight:900;
    color:var(--red);

    white-space:nowrap;
}

.logo span{
    font-size:25px;
}

.header-spacer{
    flex:1;
}

.header-button{
    width:42px;
    height:42px;

    border:none;
    border-radius:50%;

    background:#1c1c1c;
    color:white;

    font-size:20px;
    cursor:pointer;

    transition:.2s;
}

.header-button:hover{
    background:var(--red);
    transform:scale(1.08);
}

.header-button.active{
    background:var(--red);
}

/* =========================
   MAIN
========================= */

.main{
    max-width:1500px;
    margin:auto;
    padding:25px 25px 60px;
}

/* =========================
   CATEGORY NAV
========================= */

.category-nav-wrapper{
    margin-bottom:28px;
}

.category-nav{
    display:flex;
    gap:14px;

    overflow-x:auto;
    padding:5px 3px 14px;

    scrollbar-width:thin;
    scrollbar-color:var(--red) #171717;
}

.category-nav::-webkit-scrollbar{
    height:7px;
}

.category-nav::-webkit-scrollbar-track{
    background:#171717;
    border-radius:20px;
}

.category-nav::-webkit-scrollbar-thumb{
    background:var(--red);
    border-radius:20px;
}

.category-pill{
    flex:0 0 auto;

    min-width:145px;
    height:68px;

    border:1px solid #333;
    border-radius:14px;

    background:
        linear-gradient(145deg,#242424,#111);

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;

    font-size:17px;
    font-weight:700;

    cursor:pointer;

    transition:.2s;
}

.category-pill:hover{
    border-color:var(--red);
    transform:translateY(-2px);
    box-shadow:0 8px 25px rgba(229,9,20,.18);
}

.category-pill.active{
    background:
        linear-gradient(145deg,#e50914,#a90009);

    border-color:var(--red);
    box-shadow:0 8px 25px rgba(229,9,20,.25);
}

.category-icon{
    font-size:25px;
}

/* =========================
   SECTION
========================= */

.section{
    margin-top:30px;
}

.section-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:15px;
}

.section-title{
    font-size:26px;
    font-weight:800;
}

.section-title span{
    color:var(--red);
}

.section-count{
    color:var(--gray);
    font-size:14px;
}

/* =========================
   LIVE GRID
========================= */

.live-grid{
    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(220px,1fr));

    gap:18px;
}

/* =========================
   LIVE CARD
========================= */

.live-card{
    position:relative;

    background:
        linear-gradient(145deg,#202020,#111);

    border:1px solid #292929;
    border-radius:15px;

    overflow:hidden;

    cursor:pointer;

    transition:.25s;
}

.live-card:hover{
    transform:translateY(-5px);
    border-color:var(--red);

    box-shadow:
        0 15px 40px rgba(0,0,0,.55),
        0 0 20px rgba(229,9,20,.12);
}

.live-preview{
    position:relative;

    aspect-ratio:16/9;

    background:
        radial-gradient(circle,#292929,#0b0b0b);

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.live-preview img{
    width:100%;
    height:100%;

    object-fit:contain;

    padding:18px;

    transition:.3s;
}

.live-card:hover .live-preview img{
    transform:scale(1.05);
}

.live-placeholder{
    font-size:55px;
    opacity:.75;
}

.live-badge{
    position:absolute;

    top:10px;
    left:10px;

    background:var(--red);

    padding:5px 9px;

    border-radius:6px;

    font-size:11px;
    font-weight:900;

    display:flex;
    align-items:center;
    gap:5px;

    z-index:2;
}

.live-badge::before{
    content:"";

    width:7px;
    height:7px;

    background:white;

    border-radius:50%;

    animation:pulse 1.3s infinite;
}

@keyframes pulse{
    0%,100%{
        opacity:1;
    }

    50%{
        opacity:.25;
    }
}

.live-info{
    padding:13px 15px 15px;
}

.live-name{
    font-size:17px;
    font-weight:700;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.live-subtitle{
    margin-top:5px;

    color:#888;

    font-size:13px;
}

/* =========================
   CONTENT GRID
========================= */

.content-grid{
    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(180px,1fr));

    gap:17px;
}

.content-card{
    background:#1a1a1a;

    border-radius:12px;

    overflow:hidden;

    cursor:pointer;

    border:1px solid #282828;

    transition:.2s;
}

.content-card:hover{
    transform:translateY(-4px);
    border-color:var(--red);
}

.content-image{
    aspect-ratio:2/3;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(145deg,#292929,#111);

    font-size:50px;

    overflow:hidden;
}

.content-image img{
    width:100%;
    height:100%;

    object-fit:cover;
}

.content-info{
    padding:12px;
}

.content-name{
    font-size:15px;
    font-weight:700;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.content-type{
    margin-top:5px;

    color:#888;
    font-size:12px;
}

/* =========================
   EMPTY
========================= */

.empty{
    width:100%;

    padding:45px 20px;

    background:#111;

    border:1px dashed #333;

    border-radius:14px;

    text-align:center;

    color:#888;
}

/* =========================
   LOADING
========================= */

.loading{
    width:45px;
    height:45px;

    margin:50px auto;

    border:4px solid #252525;
    border-top-color:var(--red);

    border-radius:50%;

    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================
   SEARCH
========================= */

.search-overlay{
    position:fixed;
    inset:0;

    z-index:2500;

    background:rgba(0,0,0,.96);

    display:none;

    padding:35px;
}

.search-overlay.active{
    display:block;
}

.search-box{
    max-width:900px;
    margin:40px auto;
}

.search-top{
    display:flex;
    gap:12px;
}

.search-input{
    flex:1;

    height:58px;

    padding:0 20px;

    background:#181818;

    border:1px solid #333;
    border-radius:10px;

    color:white;

    font-size:18px;
}

.search-input:focus{
    outline:none;
    border-color:var(--red);
}

.close-search{
    width:58px;

    border:none;
    border-radius:10px;

    background:var(--red);
    color:white;

    font-size:22px;

    cursor:pointer;
}

.search-results{
    margin-top:30px;

    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(180px,1fr));

    gap:15px;
}

/* =========================
   PLAYER
========================= */

.player-modal{
    position:fixed;
    inset:0;

    z-index:5000;

    display:none;
    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.96);

    padding:20px;
}

.player-modal.active{
    display:flex;
}

.player-window{
    width:min(1200px,100%);

    background:#101010;

    border-radius:14px;

    overflow:hidden;

    box-shadow:0 20px 70px rgba(0,0,0,.8);
}

.player-top{
    height:55px;

    display:flex;
    align-items:center;

    padding:0 15px;

    background:#171717;

    border-bottom:1px solid #292929;
}

.player-title{
    flex:1;

    font-size:17px;
    font-weight:700;
}

.player-close{
    width:38px;
    height:38px;

    border:none;
    border-radius:50%;

    background:#292929;
    color:white;

    cursor:pointer;

    font-size:18px;
}

.player-close:hover{
    background:var(--red);
}

.video-container{
    position:relative;

    width:100%;

    background:black;

    aspect-ratio:16/9;
}

.video-container video{
    width:100%;
    height:100%;

    object-fit:contain;
}

.player-bottom{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:12px;

    padding:12px;

    background:#151515;
}

.player-btn{
    border:none;

    background:#292929;

    color:white;

    width:45px;
    height:40px;

    border-radius:8px;

    cursor:pointer;

    font-size:17px;
}

.player-btn:hover{
    background:var(--red);
}

/* =========================
   LOGIN
========================= */

.login-overlay{
    position:fixed;
    inset:0;

    z-index:6000;

    background:rgba(0,0,0,.92);

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;
}

.login-overlay.active{
    display:flex;
}

.login-box{
    width:min(400px,100%);

    padding:30px;

    background:#181818;

    border:1px solid #333;

    border-radius:15px;

    box-shadow:0 20px 60px rgba(0,0,0,.7);
}

.login-box h2{
    margin-bottom:20px;

    color:var(--red);
}

.login-input{
    width:100%;

    height:50px;

    padding:0 15px;

    background:#0d0d0d;

    border:1px solid #333;

    border-radius:8px;

    color:white;

    font-size:16px;

    margin-bottom:15px;
}

.login-input:focus{
    outline:none;
    border-color:var(--red);
}

/* =========================
   BUTTONS
========================= */

.btn{
    border:none;

    border-radius:8px;

    padding:11px 18px;

    font-weight:700;

    cursor:pointer;

    transition:.2s;
}

.btn-red{
    background:var(--red);
    color:white;
}

.btn-red:hover{
    background:var(--red2);
}

.btn-gray{
    background:#333;
    color:white;
}

.btn-green{
    background:var(--green);
    color:white;
}

.btn-danger{
    background:#d32f2f;
    color:white;
}

/* =========================
   ADMIN
========================= */

.admin{
    position:fixed;
    inset:0;

    z-index:5500;

    display:none;

    background:#080808;

    overflow-y:auto;

    padding:25px;
}

.admin.active{
    display:block;
}

.admin-container{
    max-width:1300px;
    margin:auto;
}

.admin-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:15px;

    margin-bottom:25px;

    padding:20px;

    background:#171717;

    border:1px solid #292929;

    border-radius:14px;
}

.admin-title{
    color:var(--red);

    font-size:27px;
    font-weight:900;
}

.admin-section{
    margin-bottom:20px;

    padding:20px;

    background:#151515;

    border:1px solid #292929;

    border-radius:14px;
}

.admin-section-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:15px;

    gap:15px;
}

.admin-section-title{
    font-size:21px;
    font-weight:800;
}

.admin-item{
    display:grid;

    grid-template-columns:
        55px
        minmax(130px,1fr)
        minmax(250px,2fr)
        130px
        50px
        50px;

    gap:10px;

    padding:10px;

    margin-bottom:8px;

    background:#202020;

    border-radius:9px;
}

.admin-input,
.admin-select{
    width:100%;

    height:42px;

    padding:0 10px;

    background:#0d0d0d;

    border:1px solid #383838;

    border-radius:7px;

    color:white;
}

.admin-input:focus,
.admin-select:focus{
    outline:none;

    border-color:var(--red);
}

.admin-small-btn{
    border:none;

    border-radius:7px;

    cursor:pointer;

    font-size:17px;

    color:white;
}

.save-btn{
    background:var(--green);
}

.delete-btn{
    background:#d32f2f;
}

.admin-add{
    margin-top:10px;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;

    left:50%;
    bottom:25px;

    transform:translate(-50%,100px);

    z-index:9000;

    background:#202020;

    border-left:4px solid var(--green);

    padding:14px 22px;

    border-radius:8px;

    box-shadow:0 10px 30px rgba(0,0,0,.6);

    transition:.3s;

    opacity:0;
}

.toast.show{
    transform:translate(-50%,0);
    opacity:1;
}

.toast.error{
    border-left-color:var(--red);
}

/* =========================
   FOOTER
========================= */

.footer{
    text-align:center;

    padding:30px;

    color:#555;

    font-size:13px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

    .header{
        padding:0 15px;
        height:65px;
    }

    .logo{
        font-size:21px;
    }

    .main{
        padding:18px 14px 45px;
    }

    .category-pill{
        min-width:130px;
        height:60px;

        font-size:15px;
    }

    .live-grid{
        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:12px;
    }

    .live-name{
        font-size:14px;
    }

    .live-subtitle{
        font-size:11px;
    }

    .content-grid{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

    .admin{
        padding:12px;
    }

    .admin-item{
        grid-template-columns:1fr;
    }

}

@media(max-width:500px){

    .header-button{
        width:38px;
        height:38px;

        font-size:17px;
    }

    .live-grid{
        grid-template-columns:
            repeat(2,minmax(0,1fr));
    }

    .live-preview{
        aspect-ratio:16/10;
    }

    .section-title{
        font-size:21px;
    }

    .category-pill{
        min-width:120px;
    }

    .player-modal{
        padding:0;
    }

    .player-window{
        border-radius:0;
    }

}

</style>
</head>

</div>


<!-- =========================
     LOGIN ADMIN
========================= -->

<div

        <button
            class="btn btn-gray"

            Annulla
        </button>

    </div>

</div>


<!-- =========================
     ADMIN
========================= -->

<div
    class="admin"
    id="adminPanel">

    <div class="admin-container">

        <div class="admin-header">

            <div class="admin-title">
                ⚙️ Pannello Admin

            <div style="display:flex;gap:8px;">

                <button

                <button

        </div>

        <button

            id="addCategory">

</div>

</div>

function escapeHtml(value){

    if(value === undefined ||
       value === null){

        return "";

    }

    return String(value)

        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

function showToast(
    message,
    type="success"
){

    const toast =
        document.getElementById("toast");

    toast.textContent =
        message;

    toast.className =
        "toast show " +
        (type === "error"
            ? "error"
            : "");

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(() => {

            toast.className =
                "toast";

        },3000);

}


function getItemImage(item){

    return (
        item.logo ||
        item.image ||
        item.poster ||
        item.thumb ||
        item.thumbnail ||
        ""
    );

}


function getItemUrl(item){

    return (
        item.url ||
        item.stream ||
        item.src ||
        item.link ||
        item.m3u8 ||
        ""
    );

}


function isLiveItem(item){

    return item &&
        (
            item.type === "live" ||
            getItemUrl(item).includes(".m3u8") ||
            item.category === "live-tv"
        );

}


/* =========================================================
   PROXY
========================================================= */

function applyProxy(url){

    if(!url){
        return "";
    }

    /*
       Se vuoi utilizzare sempre il proxy
       lascia questa funzione così.

       Se un URL non necessita del proxy,
       il browser tenterà comunque il caricamento.
    */

    return PROXY_URL +
        encodeURIComponent(url);

}


/* =========================================================
   CARICAMENTO FIREBASE
========================================================= */

async function loadDatabase(){

    try{

        const snapshot =
            await db.ref().once("value");

        const data =
            snapshot.val();

        if(data &&
           typeof data === "object"){

            appData = data;

        }else{

            appData = {};

        }

        renderAll();

    }catch(error){

        console.error(
            "Firebase:",
            error
        );

        showToast(
            "Errore caricamento Firebase",
            "error"
        );

        renderAll();

    }

}


/* =========================================================
   NAV CATEGORIE
========================================================= */

function renderCategoryNav(){

    const nav =
        document.getElementById(
            "categoryNav"
        );

    nav.innerHTML = "";

    const order = [

        "live-tv",
        "film",
        "serie-tv",
        "sport",
        "cartoni",
        "anime"

    ];


    const keys = [];

    order.forEach(key => {

        if(
            appData[key] ||
            key === "live-tv"
        ){

            keys.push(key);

        }

    });


    Object.keys(appData).forEach(key => {

        if(
            !keys.includes(key) &&
            key !== "favorites"
        ){

            keys.push(key);

        }

    });


    keys.forEach(key => {

        const button =
            document.createElement("button");

        button.className =
            "category-pill " +
            (
                key === currentCategory
                    ? "active"
                    : ""
            );

        button.dataset.category =
            key;

        const icon =
            CATEGORY_ICONS[key] ||
            "📁";

        let name =
            CATEGORY_NAMES[key];

        if(!name){

            name =
                key
                    .replaceAll("-"," ")
                    .replace(/\b\w/g,
                        char =>
                            char.toUpperCase()
                    );

        }else{

            name =
                name.replace(
                    /^[^\s]+\s/,
                    ""
                );

        }

        button.innerHTML = `

            <span class="category-icon">
                ${icon}
            </span>

            <span>
                ${escapeHtml(name)}
            </span>

        `;

        button.addEventListener(
            "click",
            () => {

                currentCategory =
                    key;

                renderAll();

                window.scrollTo({

                    top:0,

                    behavior:"smooth"

                });

            }
        );

        nav.appendChild(button);

    });

}

                 style="grid-column:1/-1">

    items.forEach(
        (item,index) => {

function createContentCard(
    item,
    category
){

    const card =
        document.createElement(
            "div"
        );

    card.className =
        "content-card";


    const image =
        getItemImage(item);


    card.innerHTML = `

        <div class="content-image">

            ${
                image

                ?

                `<img
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(item.name || "")}"
                    onerror="this.style.display='none';this.nextElementSibling.style.display='block';"
                >
                <span style="display:none">
                    ${escapeHtml(item.icon || "🎬")}
                </span>`

                :

                `<span>
                    ${escapeHtml(item.icon || "🎬")}
                </span>`

            }

        </div>

        <div class="content-info">

            <div class="content-name">

                ${escapeHtml(
                    item.name ||
                    "Senza titolo"
                )}

            </div>

            <div class="content-type">

                ${
                    isLiveItem(item)
                        ? "🔴 LIVE"
                        : "🔗 Link"
                }

            </div>

        </div>

    `;


    card.addEventListener(
        "click",
        () => {

            if(isLiveItem(item)){

                const items =
                    appData[category] ||
                    [];

                const index =
                    items.indexOf(item);

                openPlayer(
                    item,
                    category,
                    index
                );

            }else{

                const url =
                    getItemUrl(item);

                if(url){

                    window.open(
                        applyProxy(url),
                        "_blank"
                    );

                }

            }

        }
    );


    return card;

}

/* =========================================================
   PLAYER
========================================================= */

function openPlayer(
    item,
    category,
    index
){

    const modal =
        document.getElementById(
            "playerModal"
        );

    const video =
        document.getElementById(
            "videoPlayer"
        );


    currentCategory =
        category;

    currentChannels =
        appData[category] ||
        [];

    currentChannelIndex =
        index;


    document.getElementById(
        "playerTitle"
    ).textContent =
        item.name ||
        "Player";


    modal.classList.add(
        "active"
    );


    playVideo(
        video,
        getItemUrl(item)
    );

}


function playVideo(
    video,
    url
){

    if(hls){

        hls.destroy();

        hls = null;

    }


    video.pause();

    video.removeAttribute(
        "src"
    );

    video.load();


    if(!url){

        return;

    }


    const stream =
        applyProxy(url);


    const isM3U8 =
        url.toLowerCase()
            .includes(".m3u8");


    if(
        isM3U8 &&
        window.Hls &&
        Hls.isSupported()
    ){

        hls =
            new Hls({

                enableWorker:true,

                lowLatencyMode:true

            });


        hls.loadSource(
            stream
        );

        hls.attachMedia(
            video
        );


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            () => {

                video.play()
                    .catch(
                        () => {}
                    );

            }
        );


        hls.on(
            Hls.Events.ERROR,
            (
                event,
                data
            ) => {

                console.warn(
                    "HLS:",
                    data
                );

            }
        );

    }

    else{

        video.src =
            stream;

        video.play()
            .catch(
                () => {}
            );

    }

}


function closePlayer(){

    const modal =
        document.getElementById(
            "playerModal"
        );

    const video =
        document.getElementById(
            "videoPlayer"
        );


    video.pause();

    video.removeAttribute(
        "src"
    );

    video.load();


    if(hls){

        hls.destroy();

        hls = null;

    }


    modal.classList.remove(
        "active"
    );

}

document.getElementById(

).addEventListener(
    "click",
    () => {

        const video =
            document.getElementById(
                "videoPlayer"
            );

        if(video.paused){

            video.play();

        }else{

        }

    }
);


document.getElementById(
    "fullscreen"
).addEventListener(
    "click",
    () => {

        const container =
            document.querySelector(
                ".video-container"
            );

        if(
            document.fullscreenElement
        ){

            document.exitFullscreen();

        }else if(
            container.requestFullscreen
        ){

            container.requestFullscreen();

        }

    }
);


document.getElementById(
    "previousChannel"
).addEventListener(
    "click",
    () => {

        if(
            currentChannelIndex <= 0
        ){

            return;

        }


        currentChannelIndex--;

        const item =
            currentChannels[
                currentChannelIndex
            ];

        if(!item){

            return;

        }


        document.getElementById(
            "playerTitle"
        ).textContent =
            item.name ||
            "Player";


        playVideo(
            document.getElementById(
                "videoPlayer"
            ),
            getItemUrl(item)
        );

    }
);


document.getElementById(
    "nextChannel"
).addEventListener(
    "click",
    () => {

        if(
            currentChannelIndex >=
            currentChannels.length - 1
        ){

            return;

        }


        currentChannelIndex++;

        const item =
            currentChannels[
                currentChannelIndex
            ];

        if(!item){

            return;

        }


        document.getElementById(
            "playerTitle"
        ).textContent =
            item.name ||
            "Player";


        playVideo(
            document.getElementById(
                "videoPlayer"
            ),
            getItemUrl(item)
        );

    }
);

const searchOverlay =
    document.getElementById(
        "searchOverlay"
    );

const searchInput =
    document.getElementById(
        "searchInput"
    );

const searchResults =
    document.getElementById(
        "searchResults"
    );


document.getElementById(
    "searchButton"
).addEventListener(
    "click",
    () => {

        searchOverlay.classList.add(
            "active"
        );

        setTimeout(
            () =>
                searchInput.focus(),
            100
        );

    }
);


document.getElementById(
    "closeSearch"
).addEventListener(
    "click",
    () => {

        searchOverlay.classList.remove(
            "active"
        );

        searchInput.value = "";

        searchResults.innerHTML = "";

    }
);


searchInput.addEventListener(
    "input",
    () => {

        const query =
            searchInput.value
                .trim()
                .toLowerCase();


        searchResults.innerHTML = "";


        if(!query){

            return;

        }


        const found = [];


        Object.entries(
            appData
        ).forEach(
            ([
                category,
                items
            ]) => {

                if(
                    !Array.isArray(items)
                ){

                    return;

                }


                items.forEach(
                    item => {

                        const name =
                            String(
                                item.name ||
                                ""
                            )
                            .toLowerCase();


                        if(
                            name.includes(
                                query
                            )
                        ){

                            found.push({

                                item,

                                category

                            });

                        }

                    }
                );

            }
        );


        if(!found.length){

            searchResults.innerHTML = `

                <div class="empty"
                     style="grid-column:1/-1">

                    Nessun risultato trovato.

                </div>

            `;

            return;

        }


        found.forEach(
            result => {

                const card =
                    createContentCard(
                        result.item,
                        result.category
                    );

                searchResults.appendChild(
                    card
                );

            }
        );

    }
);

/* =========================================================
   ADMIN SECTION
========================================================= */

function createAdminSection(
    category
){

    const section =
        document.createElement(
            "section"
        );

    section.className =
        "admin-section";


    let name =
        CATEGORY_NAMES[
            category
        ];


    if(!name){

        name =
            category
                .replaceAll("-"," ")
                .replace(/\b\w/g,
                    c => c.toUpperCase()
                );

    }


    const items =
        Array.isArray(
            appData[category]
        )
            ? appData[category]
            : [];


    section.innerHTML = `

        <div
            class="admin-section-header">

            <div class="admin-section-title">

                ${
                    CATEGORY_ICONS[
                        category
                    ] || "📁"
                }

                ${escapeHtml(
                    name.replace(
                        /^[^\s]+\s/,
                        ""
                    )
                )}

            </div>

            <button
                class="btn btn-red"
                data-add>
                ➕ Aggiungi
            </button>

        </div>

        <div
            class="admin-items">
        </div>

    `;


    const itemsContainer =
        section.querySelector(
            ".admin-items"
        );


    items.forEach(
        (item,index) => {

            itemsContainer.appendChild(
                createAdminItem(
                    item,
                    category,
                    index
                )
            );

        }
    );


    section.querySelector(
        "[data-add]"
    ).addEventListener(
        "click",
        async () => {

            const newItem = {

                name:
                    "Nuovo contenuto",

                url:
                    "https://",

                icon:
                    "📺",

                type:
                    category ===
                    "live-tv"
                        ? "live"
                        : "link"

            };


            if(
                !Array.isArray(
                    appData[category]
                )
            ){

                appData[category] =
                    [];

            }


            appData[category].push(
                newItem
            );


            await saveCategory(
                category
            );


            renderAdmin();

            renderAll();

            showToast(
                "Elemento aggiunto"
            );

        }
    );


    return section;

}


/* =========================================================
   ADMIN ITEM
========================================================= */

function createAdminItem(
    item,
    category,
    index
){

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "admin-item";


    div.innerHTML = `

        <input
            class="admin-input"
            data-field="icon"
            value="${escapeHtml(item.icon || "")}"
            placeholder="📺">

        <input
            class="admin-input"
            data-field="name"
            value="${escapeHtml(item.name || "")}"
            placeholder="Nome">

        <input
            class="admin-input"
            data-field="url"
            value="${escapeHtml(getItemUrl(item))}"
            placeholder="URL">

        <select
            class="admin-select"
            data-field="type">

            <option
                value="live"
                ${
                    item.type === "live"
                        ? "selected"
                        : ""
                }>
                LIVE
            </option>

            <option
                value="link"
                ${
                    item.type !== "live"
                        ? "selected"
                        : ""
                }>
                LINK
            </option>

        </select>

        <button
            class="admin-small-btn save-btn"
            title="Salva">
            💾
        </button>

        <button
            class="admin-small-btn delete-btn"
            title="Elimina">
            🗑️
        </button>

    `;


    div.querySelector(
        ".save-btn"
    ).addEventListener(
        "click",
        async () => {

            const icon =
                div.querySelector(
                    '[data-field="icon"]'
                ).value;


            const name =
                div.querySelector(
                    '[data-field="name"]'
                ).value;


            const url =
                div.querySelector(
                    '[data-field="url"]'
                ).value;


            const type =
                div.querySelector(
                    '[data-field="type"]'
                ).value;


            item.icon =
                icon;

            item.name =
                name;

            item.url =
                url;

            item.type =
                type;


            if(
                !Array.isArray(
                    appData[category]
                )
            ){

                appData[category] =
                    [];

            }


            appData[category][index] =
                item;


            await saveCategory(
                category
            );


            renderAll();

            showToast(
                "URL e dati salvati"
            );

        }
    );


    div.querySelector(
        ".delete-btn"
    ).addEventListener(
        "click",
        async () => {

            if(
                !confirm(
                    "Vuoi eliminare questo elemento?"
                )
            ){

                return;

            }


            appData[
                category
            ].splice(
                index,
                1
            );


            await saveCategory(
                category
            );


            renderAdmin();

            renderAll();

            showToast(
                "Elemento eliminato"
            );

        }
    );


    return div;

}


/* =========================================================
   SALVATAGGIO FIREBASE
========================================================= */

async function saveCategory(
    category
){

    try{

        await db.ref(
            category
        ).set(
            appData[category] ||
            []
        );

        return true;

    }catch(error){

        console.error(
            error
        );

        showToast(
            "Errore durante il salvataggio",
            "error"
        );

        return false;

    }

}


/* =========================================================
   NUOVA CATEGORIA
========================================================= */

document.getElementById(
    "addCategory"
).addEventListener(
    "click",
    async () => {

        const name =
            prompt(
                "Nome della nuova categoria:"
            );


        if(!name){

            return;

        }


        const key =
            name
                .trim()
                .toLowerCase()
                .replace(
                    /\s+/g,
                    "-"
                )
                .replace(
                    /[^a-z0-9àèéìòù_-]/gi,
                    ""
                );


        if(!key){

            showToast(
                "Nome non valido",
                "error"
            );

            return;

        }


        if(
            appData[key] !==
            undefined
        ){

            showToast(
                "Categoria già esistente",
                "error"
            );

            return;

        }


        appData[key] = [];


        await saveCategory(
            key
        );


        CATEGORY_NAMES[key] =
            name;


        renderAdmin();

        renderAll();


        showToast(
            "Categoria creata"
        );

    }
);


/* =========================================================
   TASTO ESC
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key !==
            "Escape"
        ){

            return;

        }


        if(
            document.getElementById(
                "searchOverlay"
            ).classList.contains(
                "active"
            )
        ){

            document.getElementById(
                "closeSearch"
            ).click();

        }


        if(
            document.getElementById(
                "playerModal"
            ).classList.contains(
                "active"
            )
        ){

            closePlayer();

        }


        if(
            document.getElementById(
                "loginOverlay"
            ).classList.contains(
                "active"
            )
        ){

            document.getElementById(
                "cancelLogin"
            ).click();

        }

    }
);


/* =========================================================
   LOGIN ADMIN MEMORIZZATO
========================================================= */

if(
    localStorage.getItem(
        "ilregno_admin"
    ) === "true"
){

    isAdmin = true;

}


/* =========================================================
   AVVIO
========================================================= */

loadDatabase();


/* =========================================================
   AGGIORNAMENTO AUTOMATICO FIREBASE
========================================================= */

db.ref().on(
    "value",
    snapshot => {

        const data =
            snapshot.val();


        if(
            data &&
            typeof data ===
            "object"
        ){

            appData =
                data;


            if(
                !document.getElementById(
                    "adminPanel"
                ).classList.contains(
                    "active"
                )
            ){

                renderAll();

            }

        }

    },
    error => {

        console.error(
            "Firebase realtime:",
            error
        );

    }
);

</script>
