<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muflone</title>
<link rel="preconnect" href="https://il-regno-app-default-rtdb.europe-west1.firebasedatabase.app" crossorigin>
<style>
:root{--bg:#08090b;--s1:#121317;--s2:#1c1d22;--s3:#2b2c32;--plate:#1d1e23;--text:#f4f4f2;--muted:#a8a9b0;--m3:#8d8f98;--red:#ff3048;--verde:#2fd06b;--yel:#ffc531;
  --line:rgba(255,255,255,.10);--gut:24px;--anello:rgba(8,9,11,.6);--sito:rgba(12,13,16,.8);--film:255,255,255;--serie:255,255,255;--anime:255,255,255;--sport:255,255,255}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.3 Roboto,system-ui,sans-serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body.pl{overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse 62% 48% at 20% -8%,rgba(255,48,72,.09),transparent 70%),linear-gradient(180deg,#0c0c0f,#08090b)}
button{font:inherit;color:inherit;cursor:pointer;margin:0;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus{outline:none}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
#modal :focus-visible{outline-color:var(--red);outline-offset:2px}
svg.s{fill:none;stroke:currentColor;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round;display:block}
.top{height:80px;display:flex;align-items:center;padding:0 28px 0 32px}
.marchio{margin-right:auto}
.marchio svg{height:26px;width:auto;display:block}
.marchio .m{fill:var(--red)}.marchio .resto{fill:#fff}
#ora{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tasto{height:64px;display:flex;align-items:center;gap:8px;margin-left:14px;padding:0 18px 0 14px;border-radius:32px;background:var(--s2);font-size:14px;font-weight:500}
.tasto svg{width:17px;height:17px;stroke-width:5}
.ricerca{display:flex;flex:1 1 0;min-width:0;gap:10px;margin-left:14px}
.ricerca input{flex:1 1 0;min-width:0;height:64px;padding:0 18px;border-radius:14px;border:1px solid var(--red);background:#0b0c10;color:var(--text);font:inherit;font-size:17px}
.ricerca button{flex:0 0 64px;height:64px;border-radius:14px;background:var(--s2);font-size:20px}
body.cerco #palco,body.cerco #porte,body.cerco #ora,body.cerco #crlink{display:none}
.palco{display:grid;height:224px;margin:0 32px}
.eroe{position:relative;border-radius:16px;overflow:hidden;background:#0d0e11;min-width:0}
.eroe .quadro,.eroe .targa{position:absolute;right:0;top:0;width:100%;height:100%}
.eroe .quadro{object-fit:cover;object-position:50% 28%}
.velo{position:absolute;inset:0}
.eroe .quadro,.eroe .targa{width:76%}
.velo{background:linear-gradient(90deg,#0d0e11 0,#0d0e11 34%,rgba(13,14,17,.92) 50%,rgba(13,14,17,.6) 61%,rgba(13,14,17,.15) 78%,rgba(13,14,17,0) 90%)}
.eroe .testo{position:absolute;left:22px;bottom:14px;right:18px;max-width:520px}
.occhiello{position:absolute;top:10px;left:14px;height:32px;display:flex;align-items:center;gap:7px;padding:0 9px 0 12px;border-radius:17px;background:rgba(7,8,11,.7);border:1px solid rgba(255,255,255,.16);font-size:13px;font-weight:600}
.occhiello i{width:3px;height:14px;border-radius:2px;background:var(--red)}
.occhiello:after{content:"";position:absolute;inset:-8px -6px}
.occhiello svg{width:15px;height:15px;margin-left:-2px;transform:rotate(90deg);color:var(--muted);stroke-width:5}
.occhiello:focus-visible{background:rgba(255,255,255,.2)}
.eroe h1{font-size:24px;line-height:1.15;font-weight:700;letter-spacing:-.01em;margin:5px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.eroe h1.lungo{font-size:19px}
.meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:var(--muted);min-width:0}
.meta>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.meta b{color:var(--text);font-weight:600}
.punt,.ver{flex:none;font-size:12px;font-weight:600;border-radius:6px;padding:2px 7px;white-space:nowrap}
.punt{color:#fff;background:rgba(255,255,255,.16)}
.ver{color:#e9e9e6;box-shadow:inset 0 0 0 1px rgba(255,255,255,.42)}
.linea{height:4px;border-radius:2px;background:rgba(255,255,255,.17);margin-top:10px;overflow:hidden}
.linea i{display:block;height:100%;background:var(--red)}
.azioni{display:flex;gap:12px;margin-top:12px}
.bott{height:64px;padding:0 22px 0 18px;border-radius:32px;font-weight:600;display:inline-flex;align-items:center;gap:10px;white-space:nowrap}
.bott svg{width:17px;height:17px}
.partita .bott svg{width:20px;height:20px}
.bott.primo{background:#e0263d;color:#fff}
.bott.primo:focus-visible{background:#fff;color:#0b0c10}
.bott.secondo{background:rgba(255,255,255,.11);font-weight:500}
.targa{background:#16171b;display:grid;place-items:center;color:rgba(255,255,255,.92)}
.targa svg{width:30px;height:30px;stroke-width:3.4}
.eroe .targa{place-items:center end;padding-right:12%}
.eroe .sz{left:auto;right:0;width:74%;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22%);mask-image:linear-gradient(90deg,transparent,#000 22%)}
.eroe .targa svg{width:120px;height:120px;opacity:.5;stroke-width:3}
.targa svg.op{opacity:1;stroke:none}
.sz{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.porte{display:grid;gap:12px;height:150px;margin:16px 32px 0}
.porta{position:relative;isolation:isolate;overflow:hidden;border-radius:16px;padding:14px 14px 12px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;background:var(--s1)}
.sf{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;z-index:-1}
.porta:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(8,9,11,.94),rgba(8,9,11,.72) 30%,rgba(8,9,11,0) 62%)}
button.porta:focus-visible:after{background:linear-gradient(0deg,rgba(8,9,11,.9),rgba(8,9,11,.4) 32%,rgba(8,9,11,0) 55%)}
.porta.larga:after{background:linear-gradient(0deg,rgba(8,9,11,.92),rgba(8,9,11,.74) 48%,rgba(8,9,11,.12))}
.porta.ko:after{box-shadow:inset 0 0 0 2px rgba(255,197,49,.7)}.porta.ko .sf{opacity:.45}
.piede{display:flex;align-items:flex-end;justify-content:space-between;gap:6px}
.pn{display:block;font-size:16px;font-weight:600}
.apri{width:18px;height:18px;flex:none;color:var(--muted);stroke-width:5;margin-bottom:2px}
.punto{display:none;position:absolute;top:14px;right:18px;width:8px;height:8px;border-radius:4px;background:var(--verde);box-shadow:0 0 0 3px var(--anello)}
.ok>.punto,.ko>.punto{display:block}
.ko>.punto{display:none}
.porta.ko,.sito.ko{box-shadow:inset 0 0 0 1px rgba(255,197,49,.55)}
.giu{display:none;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--yel);margin-top:2px;white-space:nowrap}
.ko .giu{display:flex}
.giu svg{width:13px;height:13px;flex:none;stroke-width:5}
.porta.larga{padding:12px;display:grid;grid-template-rows:auto 1fr;gap:10px;justify-content:normal}
.capo{display:flex;align-items:center;gap:11px}
.siti{display:grid;gap:12px;align-self:end}
.sito{position:relative;height:64px;border-radius:12px;background:var(--sito);font-weight:500;font-size:14px;line-height:1.18;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 4px}
.sito:focus-visible{background:var(--s3)}
.sito .punto{top:7px;right:8px;width:7px;height:7px}
.sito .apri{position:absolute;right:6px;bottom:6px;width:13px;height:13px;margin:0}
.ko.sito .giu{display:block;white-space:normal;line-height:1.15}
.sito .giu svg{display:inline-block;vertical-align:-2px;margin-right:3px}
button.porta:hover,.sito:hover,.ch:hover,.bott:hover,.tasto:hover,.occhiello:hover{box-shadow:0 0 0 2px rgba(255,48,72,.6)}
button.porta.ko:hover,.sito.ko:hover,.ch.off:hover{box-shadow:0 0 0 2px var(--yel)}
.admin:hover{color:#c9ccd4}
.tvz{margin:24px 32px 0}
.titolo{display:flex;align-items:baseline;gap:10px;height:22px;margin-bottom:8px}
.titolo h2{font-size:15px;font-weight:600;margin:0;position:relative}

.titolo span{font-size:12px;color:var(--m3)}
.tvz>.titolo{height:26px;margin-bottom:4px}
.tvz>.titolo h2{font-size:19px;font-weight:700;padding-left:12px}
.tvz>.titolo h2:before{content:"";position:absolute;left:0;top:3px;width:4px;height:19px;border-radius:2px;background:var(--red)}
.gruppo{margin-top:20px}
.tvz>.gruppo:first-of-type{margin-top:10px}
.griglia{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ch{content-visibility:auto;contain-intrinsic-size:auto 210px auto 64px;display:flex;align-items:center;gap:11px;height:64px;border-radius:14px;background:var(--s1);
  border:1px solid transparent;padding:0 10px 0 5px;min-width:0;width:100%;text-align:left}
.ch:focus-visible{background:var(--s3)}
.tasto:focus-visible{background:var(--s3)}
.plate{flex:0 0 58px;height:54px;border-radius:10px;background:var(--plate);display:flex;align-items:center;justify-content:center;font-weight:900;color:#c9ccd6;letter-spacing:-.3px;line-height:1}
.plate.s1{font-size:28px}.plate.s3{font-size:20px}.plate.s4{font-size:17px}.plate.s5{font-size:16px;letter-spacing:-.6px}
.plate img{display:none;width:50px;height:46px;object-fit:contain}
.plate.ok img{display:block}
.info{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.info b,.live{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info b{font-size:15px;font-weight:500}
.live{font-size:12px;font-weight:600;color:var(--red)}
.ch:not(.off) .live{font-size:9px;letter-spacing:.05em}
.prog{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.prog:empty{display:none}
.ch.off{background:transparent;border:1px dashed rgba(255,197,49,.5)}
.ch.off .plate{background:#121318;color:#8a7a4a}
.ch.off b{color:#c9c2a8}
.ch.off .live{color:var(--yel)}
.ct{position:relative;min-width:0}#tv .cx{display:none}.cx{position:absolute;right:0;top:0;width:52px;height:64px;align-items:center;justify-content:center;font-size:20px;color:var(--muted)}
.sk{height:64px;border-radius:14px;background:var(--s1)}
.msg{padding:12px 0;font-size:16px;color:var(--muted)}
#avviso{padding:0 32px 8px}
.fondo{display:flex;align-items:center;justify-content:center;gap:18px;margin:28px 32px 30px}
.fondo .bott.secondo{background:var(--s2)}
.admin{height:64px;padding:0 16px;font-size:14px;color:var(--m3);display:inline-flex;align-items:center;border-radius:32px}
body.vuota .porte{height:236px;margin-top:8px}
body.vuota .sito{height:96px}
#modal{--margine-lato:48px;display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:9999;font-size:16px;line-height:1.2}
#modal.open{display:block}
html.pl,html.pl body{overflow-x:hidden}
#video{position:absolute;top:0;left:0;width:100%;height:100%;background:#000;object-fit:contain}
.barra{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:8px var(--margine-lato);pointer-events:none}
.nome{flex:1 1 0;min-width:0;padding-top:4px}
.barra strong{font-size:17px;font-weight:700;text-shadow:0 2px 6px #000}
#closePlayer{flex:none;pointer-events:auto;width:64px;height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.6);font-size:22px}
/* lettore aperto: niente si ridisegna dietro (hls.js) */
body.pl>:not(#modal){visibility:hidden}body.pl::before{display:none}
@media(max-width:700px){
  .top{height:60px;padding:0 12px 0 16px}
  .marchio svg{height:22px}
  #ora{display:none}
  .tasto{height:56px;min-width:56px;margin-left:8px;padding:0 14px;justify-content:center}
  #crlink span{display:none}#tv .cx{display:flex}.ct .ch{padding-right:44px}#crlink{padding:0}
  .ricerca input,.ricerca button{height:56px}
  .palco{display:block;height:auto;margin:2px 16px 0}
  .eroe{height:208px;border-radius:16px;isolation:isolate;display:flex;flex-direction:column;justify-content:flex-end;padding:0 16px 14px}
  .eroe .quadro,.eroe .targa,.velo{z-index:-1}.eroe .testo{position:static}
  .eroe .quadro,.eroe .targa{width:100%;height:60%}
  .occhiello{top:12px;left:12px;height:36px}
  .eroe .targa{place-items:center;padding:0}
  .eroe .sz{width:100%;-webkit-mask-image:none;mask-image:none}
  .eroe .targa svg{width:64px;height:64px}
  .velo{background:linear-gradient(0deg,#0d0e11 0,#0d0e11 44%,rgba(13,14,17,.92) 56%,rgba(13,14,17,.55) 70%,rgba(13,14,17,0) 86%)}
  .eroe h1{font-size:22px;-webkit-line-clamp:1}
  .bott{height:56px}
  .azioni .bott{flex:1;justify-content:center;padding:0 10px}
  .porte,body.vuota .porte{grid-template-columns:repeat(3,minmax(0,1fr))!important;height:auto;margin:16px 16px 0}
  .ko .giu{display:block;white-space:normal;line-height:1.15}.giu svg{display:inline-block;vertical-align:-2px;margin-right:3px}
  .porta>.punto{right:12px;top:12px}
  .porta{height:104px;padding:12px 10px 10px 12px}
  .pn{font-size:15px}
  body.vuota .porta{height:120px}
  .porta.larga,body.vuota .porta.larga{grid-column:1/-1;height:auto}
  body.vuota .sito{height:64px}
  .tvz{margin:24px 16px 0}
  #avviso{padding:0 16px 8px}
  .griglia{grid-template-columns:1fr}
  .fondo{margin:24px 16px 28px}
}
@media(max-height:450px) and (min-width:701px){
  .top{height:52px;padding:0 20px 0 24px}
  .marchio svg{height:20px}
  .tasto{height:52px}
  .palco{height:150px;margin:0 24px}
  .eroe .testo{bottom:10px;left:18px;right:48%}
  .occhiello{top:10px;left:auto;right:26px;height:32px}
  .eroe h1,.eroe h1.lungo{font-size:19px;-webkit-line-clamp:1;margin:0}
  .meta{margin-top:3px}
  .linea{margin-top:7px}
  .azioni{margin-top:9px}
  .eroe .targa svg{width:72px;height:72px}
  .porte,body.vuota .porte{height:92px;margin:12px 24px 0}
  .porta{padding:0 12px 9px}
  .porta .segno,body.vuota .porta .segno{width:32px;height:32px;flex:none}
  .porta.larga{display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px;padding:0 10px 0 12px}
  .capo{flex-direction:column;gap:2px;flex:none}
  .capo .pn{font-size:14px}
  .capo .segno,body.vuota .capo .segno{width:28px;height:28px}
  .siti{flex:1;align-self:center}
  .sito,body.vuota .sito{height:64px}
  .porta .pn{font-size:15px;line-height:1.15}
  .tvz{margin:20px 24px 0}
  .griglia{grid-template-columns:repeat(3,minmax(0,1fr))}
  .fondo{margin:24px}
  .porte.molti{height:auto}
  .molti .porta{min-height:92px}
  .molti .siti.n4{padding:8px 0}
}
@media(max-width:700px),(max-height:450px){
  .molti .siti.n4{grid-template-columns:1fr 1fr!important}
}
</style>
</head>

<script>
const DB="https://il-regno-app-default-rtdb.europe-west1.firebasedatabase.app/v2.json";
const $=s=>document.querySelector(s);
const MESI="gennaio febbraio marzo aprile maggio giugno luglio agosto settembre ottobre novembre dicembre".split(" ");
const arr=x=>Array.isArray(x)?x.filter(Boolean):x?Object.values(x):[];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const scade=ms=>{
  if(AbortSignal.timeout)return AbortSignal.timeout(ms);
  const c=new AbortController(); setTimeout(()=>c.abort(),ms); return c.signal;
};
const mem={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};
let D=null, STATO={}, ST={}, GUIDA={}, secondari=false, statoNoto=false;

function leggiCache(){
  try{
    const o=JSON.parse(mem.get("ilregno.v2")), v=o.canali?o:Object.values(o).find(x=>x&&x.canali);
    const d=new Date(o.d||o.data||o.ts||o.date||0);
    return v?{v,d:isNaN(d)?null:d}:null;
  }catch(e){return null}
}
const salvaCache=v=>mem.set("ilregno.v2",JSON.stringify({d:new Date().toISOString(),v}));

function programma(c,n=Date.now()){
  const l=arr(GUIDA.canali&&GUIDA.canali[c.epg||c.id]);
  let ora;
  l.forEach(p=>{
    const i=Date.parse(p.i), f=Date.parse(p.f);
    if(i<=n&&n<f&&(!ora||i>Date.parse(ora.i)))ora=p;
  });
  return ora;
}

const B=window.Muflone, htt=u=>typeof u==="string"&&/^https?:\/\/[^\s/]+/i.test(u), num=x=>typeof x==="number"&&isFinite(x);
const MONDI={film:["Film"],serie:["Serie TV"],sport:["Sport"],anime:["Anime"]};
const segno=(id,cl)=>`<svg class="s ${cl||""}" viewBox="0 0 48 48"><use href="#${id}"/></svg>`;
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return""}};
const lettere=s=>String(s).toLowerCase().replace(/[^a-z]/g,"");
let STORIA=[], VISTI=0, vS=1, vP=0;
function leggiStoria(){
  STORIA=[]; VISTI=0; vS++;
  if(!B||typeof B.continua!=="function")return;
  try{const l=JSON.parse(B.continua()); if(Array.isArray(l))STORIA=l.filter(e=>e&&htt(e.pagina)&&typeof e.titolo==="string"&&num(e.secondi)&&num(e.durata)&&e.durata>0)}catch(e){}
  if(!STORIA.length&&typeof B.cronologia==="function")try{VISTI=JSON.parse(B.cronologia()).length||0}catch(e){}
}
function mondo(e){
  const h=host(e.pagina), k=op(e)?"onepace":lettere(h), ep=/[?&]e=\d/.test(e.pagina);
  const s=D&&D.siti.find(x=>host(x.url)===h&&!(ep&&(x.pillola||x.id)==="film"))||D&&D.siti.find(x=>k.includes(lettere(x.nome))&&lettere(x.nome).length>3);
  let c=s?s.pillola||s.id:/anime|onepace/.test(k)?"anime":ep?"serie":"film";
  if(!MONDI[c])c="film";
  return{c,dove:s&&sitiDi(c).length>1?s.nome:MONDI[c][0]};
}
function parti(e,dove,c){
  let t=e.titolo.trim()||dove, ver="", p="";
  try{const q=new URL(e.pagina).searchParams, s=q.get("s"), n=q.get("e"); if(/^\d{1,3}$/.test(s)&&/^\d{1,3}$/.test(n))p=`S${+s} E${+n}`}catch(x){}
  const m=/\s*\(([^)]+)\)\s*$/.exec(t);
  if(m){ver=m[1].charAt(0).toUpperCase()+m[1].slice(1); t=t.slice(0,m.index)}
  const d=/ · /.exec(t);
  if(!p&&d){p=t.slice(d.index+3); t=t.slice(0,d.index)}
  if(p)return{sopra:t,nome:p,ver,t,p};
  const s=c!="sport"&&/\s[-–]\s|:\s/.exec(t);
  return s?{sopra:t.slice(0,s.index),nome:t.slice(s.index+s[0].length),ver,t}:{sopra:dove,nome:t,ver,t};
}
const due=n=>String(n).padStart(2,"0");
const orologio=s=>{s=Math.floor(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60); return (h?h+":"+due(m):m)+":"+due(s%60)};
const tinta=c=>`--t:var(--${c})`;
const pill=(x,c)=>x?`<span class="${c}">${esc(x)}</span>`:"";
const quanto=e=>Math.max(0,Math.min(100,e.secondi/e.durata*100)).toFixed(1)+"%";
const COP=/^(https:\/\/[^\s/]+\S*|data:image\/(webp|jpeg|png);base64,[\w+\/=]+)$/;
const copertina=u=>typeof u==="string"&&u.length<=(u[0]==="d"?2e5:500)&&COP.test(u);
const op=e=>e.sito==="pixeldrain.net"&&/^One Pace/.test(e.titolo)||lettere(e.sito||host(e.pagina)).includes("onepace");
let COPS={};
function figura(e,c,cl){
  const u=e.copertina, k=copertina(u)&&(u[0]=="d"?u.length+u.slice(-24):u);
  if(k)COPS[k]=u;
  return `<span class="targa" style="${tinta(c)}">${k?"":op(e)?OPS:SZ(cl?c+"-palco":c)}</span>`+(k?`<img class="${cl}" data-c="${esc(k)}" data-m="${cl?c+"-palco":c}"${op(e)?' data-o="1"':""} alt="" decoding="async" referrerpolicy="no-referrer"${cl?"":' loading="lazy"'} onerror="ko(this)">`:"");
}
const OPS='<svg class="op" viewBox="0 0 48 48"><use href="#s-op"/></svg>', SZ=c=>`<img class="sz" ${dopo?"src":"data-s"}="sezioni/${c}.svg" alt="" decoding="async" onerror="this.remove()">`, ko=i=>{i.previousSibling.innerHTML=i.dataset.o?OPS:SZ(i.dataset.m); i.remove()};
const P=window.__partita, SP=()=>sitiDi("sport")[0];
const squadre=t=>{const m=/^(.+?)\s+(?:vs\.?|-|–)\s+(.+)$/i.exec(t.split(" | ")[0]); return m?m[1]+" – "+m[2]:"Partita su "+SP().nome};
function partitaH(){
  const s=SP(); if(!P||!s||P.fa>=180)return "";
  return `<section class="palco" id="palco"><div class="eroe partita"><span class="targa">${SZ("sport-palco")}</span><div class="velo"></div><div class="testo">`+
    `<h1>${esc(squadre(P.titolo))}</h1><div class="meta"><span>${esc(s.nome)} · lasciata ${P.fa} min fa</span></div>`+
    `<div class="azioni"><button class="bott primo" data-t="partita" data-i="${esc(s.id)}">${segno("s-sport")}Torna alla partita</button></div></div></div></section>`;
}
function palcoH(){
  COPS={};
  if(!STORIA.length)return partitaH();
  const v=STORIA[0], {c,dove}=mondo(v), q=parti(v,dove,c);
  return `<section class="palco" id="palco"><div class="eroe" style="${tinta(c)}">${figura(v,c,"quadro")}<div class="velo"></div><div class="testo">`+
    `<h1${q.t.length>30?' class="lungo"':""}>${esc(q.t)}</h1><div class="meta">${pill(q.p,"punt")}${pill(q.ver,"ver")}<span>${dove!==q.t?esc(dove)+" · ":""}sei a <b>${orologio(v.secondi)}</b> di ${orologio(v.durata)}</span></div>`+
    `<div class="linea"><i style="width:${quanto(v)}"></i></div><div class="azioni"><button class="bott primo" data-t="riprendi" data-i="0" data-p="${esc(v.pagina)}">${segno("s-play")}Riprendi</button>`+
    (typeof B.daCapo=="function"?`<button class="bott secondo" data-t="inizio" data-i="0" data-p="${esc(v.pagina)}">${segno("s-capo")}Dall’inizio</button>`:"")+
    `</div></div><button class="occhiello" id="tutti"><i></i>Continua a guardare${segno("s-su")}</button></div></section>`;
}

const sitiDi=cat=>D?D.siti.filter(x=>(x.pillola||x.id)===cat):[];
const SF=k=>`<img class="sf" ${dopo?"src":"data-s"}="sezioni/${k}.svg" alt="" decoding="async" onerror="this.remove()">`, PROVA=`<span class="giu">${segno("s-avviso")}Prova ad aprire</span>`;
function porteH(){
  let h="", col=[], molti=false;
  Object.keys(MONDI).forEach(k=>{
    const [nome,sg]=MONDI[k], l=sitiDi(k);
    if(!l.length)return;
    if(l.length>1){
      if(l.length>3)molti=true;
      col.push((.4+.78*l.length).toFixed(2)+"fr");
      h+=`<div class="porta larga" style="${tinta(k)}">${SF(k)}<div class="capo"><span class="pn">${nome}</span></div><div class="siti n${l.length}" style="grid-template-columns:repeat(${l.length},minmax(0,1fr))">`+
        l.map(s=>`<button class="sito" data-t="sito" data-i="${esc(s.id)}"><span class="punto"></span>${esc(s.nome)}${PROVA}${segno("s-apri","apri")}</button>`).join("")+"</div></div>";
    }else{
      col.push("1fr");
      h+=`<button class="porta" style="${tinta(k)}" data-t="sito" data-i="${esc(l[0].id)}">${SF(k)}<span class="punto"></span><span class="piede"><span><span class="pn">${nome}</span>${PROVA}</span>${segno("s-apri","apri")}</span></button>`;
    }
  });
  return h?`<nav class="porte${molti?" molti":""}" id="porte" style="grid-template-columns:${col.join(" ")}">${h}</nav>`:"";
}

function scheda(c){
  const n=(c.sigla||"").length, z=n<=2?"s1":"s"+Math.min(n,5);
  return `<button class="ch" data-t="canale" data-i="${esc(c.id)}"><span class="plate ${z}">`+
    `<img data-src="loghi/${esc(c.id)}.webp" width="50" height="46" alt=""><span class="sg">${esc(c.sigla||"")}</span></span>`+
    `<span class="info"><b>${esc(c.nome)}</b><span class="live">&#9679; LIVE</span><span class="prog"></span></span></button>`;
}
const griglia=(t,n,l)=>`<div class="gruppo"><div class="titolo"><h2>${t}</h2>${n}</div><div class="griglia">${l.map(scheda).join("")}</div></div>`;
const filtro=q=>c=>!q||String(c.nome).toLowerCase().includes(q);
let tutti=0;
const recC=()=>{
  const r=jx("ilregno.rc",[]), l=[...new Set([...r,...leggiRecenti().filter(x=>x&&x.tipo=="canale").map(x=>x.id)])].slice(0,3);
  if(l.join()!=r.join())mem.set("ilregno.rc",JSON.stringify(l));   // i canali di una pagina di prima passano alla loro lista, che i siti non toccano
  return l;
};
function mieiH(q){
  const p=jx("ilregno.preferiti",[]), l=[...new Set([...p,...recC()])].map(i=>trova("canale",i)).filter(c=>c&&filtro(q)(c)), v=tutti?l:l.slice(0,8);
  return l.length?`<div class="gruppo" id="miei"><div class="titolo"><h2>I tuoi canali</h2></div><div class="griglia">`+v.map(c=>p.includes(c.id)?scheda(c):
    `<div class="ct">${scheda(c)}<button class="cx" data-r="${esc(c.id)}" aria-label="Togli dai recenti">✕</button></div>`).join("")+
    (v.length<l.length?`<button class="ch" data-t="tutti" data-i="tutti"><b>Tutti i tuoi canali (${l.length})</b></button>`:"")+"</div></div>":"";
}
function tvH(q){
  const f=filtro(q);
  const gr=[...D.gruppi];
  D.canali.forEach(c=>{c.gruppo=c.gruppo||"Altri"; if(!gr.includes(c.gruppo))gr.push(c.gruppo)});
  let h='<i id="miei" hidden></i>', n=0;
  gr.forEach(g=>{
    const l=D.canali.filter(c=>c.gruppo===g&&f(c));
    if(!l.length)return;
    n+=l.length; h+=griglia(esc(g),`<span>${l.length} canali</span>`,l);
  });
  return `<section class="tvz" id="tv">`+(n?`<div class="titolo"><h2>Live TV</h2><span>${D.canali.length} canali</span></div>`+h:'<div class="msg">Nessun canale trovato</div>')+"</section>";
}

const fatto={};
function sostituisci(id,h){
  if(fatto[id]===h)return;
  fatto[id]=h; if(id=="tv")delete fatto.miei;
  $("#"+id).outerHTML=h||`<i id="${id}" hidden></i>`;
}
// col lettore aperto non si riscrive niente: alla chiusura
let rinvio=0, aspetto=0;
const fermo=()=>aspetto||M.classList.contains("open")&&(rinvio=1);
function disegna(){
  if(fermo())return;
  const q=$("#q").value.trim().toLowerCase();
  if(vP!==vS){vP=vS; sostituisci("palco",palcoH())}
  if(D){sostituisci("porte",porteH()); sostituisci("tv",tvH(q)); sostituisci("miei",mieiH(q))}
  document.body.classList.toggle("vuota",!STORIA.length&&!partitaH());
  $("#crlink").hidden=STORIA.length||!VISTI;
  aggiorna(); osservaLoghi(); if(dopo)copri();
}
const copri=()=>{document.querySelectorAll("#palco img[data-c]").forEach(i=>{const u=COPS[i.dataset.c]; i.removeAttribute("data-c"); if(u)i.src=u});
  document.querySelectorAll("img[data-s]").forEach(i=>{i.src=i.dataset.s; i.removeAttribute("data-s")})};
function aggiorna(){
  if(fermo())return;
  if(window.unisci)unisci();
  if(statoNoto)document.querySelectorAll("#porte [data-i]").forEach(el=>{
    const c=((STATO.siti||{})[el.dataset.i]||{}).ok===false?"ko":"ok";
    if(el.dataset.s!==c){el.dataset.s=c; el.classList.toggle("ok",c==="ok"); el.classList.toggle("ko",c==="ko")}
  });
  if(!D)return;
  document.querySelectorAll(".ch").forEach(el=>{
    const c=trova("canale",el.dataset.i); if(!c)return;
    const ko=((STATO.canali||{})[c.id]||{}).ok===false;
    if(el.classList.contains("off")!==ko){el.classList.toggle("off",ko); el.classList.toggle("ko",ko)}
    scrivi(el.querySelector(".live"),ko?"non disponibile":"● LIVE");
    scrivi(el.querySelector(".prog"),ko?"":(programma(c)||{}).t||"");
  });
}
const scrivi=(el,t)=>{if(el&&el.textContent!==t)el.textContent=t};
const vista=window.IntersectionObserver&&new IntersectionObserver(l=>l.forEach(o=>{
  if(!o.isIntersecting)return;
  vista.unobserve(o.target); caricaLogo(o.target);
}),{rootMargin:"200px"});
function caricaLogo(el){
  const i=el.querySelector("img[data-src]"); if(!i)return;
  i.onload=()=>{i.parentNode.classList.add("ok"); const s=i.parentNode.querySelector(".sg"); if(s)s.remove()};
  i.src=i.__u||i.dataset.src; i.removeAttribute("data-src");
}
function osservaLoghi(){
  if(vista)vista.disconnect();
  document.querySelectorAll(".ch").forEach(el=>vista?vista.observe(el):caricaLogo(el));
}

}

const trova=(tipo,id)=>D&&(tipo==="sito"?D.siti:D.canali).find(x=>x.id===id);
const jx=(k,d)=>{try{const v=JSON.parse(mem.get(k));return v&&typeof v==="object"&&Array.isArray(v)===Array.isArray(d)?v:d}catch(e){return d}};
const leggiRecenti=()=>jx("ilregno.recenti",[]);
const recenti=(tipo,id,via)=>recC()&&mem.set("ilregno.recenti",JSON.stringify([...via?[]:[{tipo,id}],...leggiRecenti().filter(x=>x&&!(x.tipo===tipo&&x.id===id))].slice(0,3)));
function apri(tipo,id){
  const o=trova(tipo,id); if(!o)return;
  if(tipo==="canale")return guarda(o);
  recenti(tipo,id);
  if(o.url)location.href=indirizzo(o);
}

  recenti("canale",id); mem.set("ilregno.rc",JSON.stringify([id,...jx("ilregno.rc",[]).filter(x=>x!==id)].slice(0,3)));
  mem.set("ilregno.ct",JSON.stringify({...jx("ilregno.ct",{}),[id]:Date.now()})); rinvio=1;
});
function togliRecente(id){
  recenti("canale",id,1); mem.set("ilregno.rc",JSON.stringify(jx("ilregno.rc",[]).filter(x=>x!==id))); disegna();
}
function indirizzo(o){
  const s=(STATO.siti||{})[o.id];
  return s&&s.nuovo&&s.sostituisce===o.url?s.nuovo:o.url;
}

const M=$("#modal");
let cur=null, pos=0, atteso=null;
function guarda(c){
  segnato=null;
  if(window.riproduci)return riproduci(c);
  if(!M.classList.contains("open"))pos=scrollY;
  atteso=cur=c;
  M.className="open"; document.body.classList.add("pl"); document.documentElement.classList.add("pl");
  $("#titolo").textContent=c.nome;
  carica("visione.js").then(ok=>{
    if(atteso!==c)return;
    atteso=null;
    if(ok)return riproduci(c);
    console.warn("lettore",c.id,"V01");
    $("#titolo").textContent=`${c.nome} non disponibile ora (codice V01)`;
  });
}
function chiudiLettore(){
  atteso=null; if(window.ferma)ferma(); M.className=""; clearTimeout(tb);
  document.body.classList.remove("pl"); document.documentElement.classList.remove("pl"); clearInterval(ti);
  if(scrollY!==pos)scrollTo(0,pos);
  ora();
  if(!rinvio)return;
  // un solo compenso dello scorrimento (Chrome ancora già la pagina): si misura dopo il disegno; vale anche per la stella (visione.js)
  rinvio=0;
  const a=fonte&&fonte.isConnected&&fonte, y=a&&a.getBoundingClientRect().top, g=$("#gruppi"), h=g.offsetHeight, s=scrollY;
  disegna(); scrollBy(0,a&&a.isConnected?a.getBoundingClientRect().top-y:g.offsetHeight-h-(scrollY-s));
}
let tb=0, ti=0;
const carica=f=>carica[f]||(carica[f]=new Promise(ok=>{
  const s=document.head.appendChild(document.createElement("script"));
  s.src=f; s.onload=ok; s.onerror=()=>{delete carica[f]; ok(0)};
}));

let voceRicerca=false;
function ricerca(on,dalBack){
  if(on===!$("#ricerca").hidden)return;
  $("#cerca").hidden=on; $("#ricerca").hidden=!on; document.body.classList.toggle("cerco",on);
  if(on){$("#q").focus(); if(!voceRicerca){history.pushState(null,"");voceRicerca=true}}
  else{
    $("#q").value="";
    if(voceRicerca){voceRicerca=false; if(!dalBack)history.back()}
  }
  disegna();
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  if(b.dataset.p){if(!htt(b.dataset.p))return; if(b.dataset.t=="inizio")try{B.daCapo(b.dataset.p)}catch(x){} return void(location.href=b.dataset.p)}
  if(b.dataset.r)return togliRecente(b.dataset.r);
  if(b.dataset.t=="tutti"){tutti=1; disegna(); const x=$("#miei .griglia").children[8]; return x&&(x.querySelector("button")||x).focus()}
  if(b.dataset.t){if(b.dataset.t=="canale")fonte=b; return apri(b.dataset.t,b.dataset.i)}
  switch(b.id){
    case "su": {
      scrollTo(0,0);
      const vede=e=>e.getClientRects().length;
      const p=[...document.querySelectorAll("#gruppi button,#gruppi a[href]")].find(vede)||[...document.querySelectorAll(".top button")].find(vede);
      if(p)p.focus({preventScroll:true});
      return;
    }
    case "cerca": return ricerca(true);
    case "crlink": case "tutti": if(!window.apriCron){crDopo=1; carica("continua.js")} return;
    case "chiudiRicerca": return ricerca(false);
    case "closePlayer": case "chiudi": return chiudiLettore();
    case "riprova": return guarda(cur);
  }
});

});

function dopoPrimaSchermata(){

}

if(B&&B.storiaPronta&&!pronta()){aspetto=1; setTimeout(attendi,25)}else avvia();
