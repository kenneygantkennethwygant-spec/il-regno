<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Il Regno</title>
<style>
/* Il Regno: pagina per la Fire TV Stick (Muflone, 960x540 CSS). Aspetto dalla bozza «R-sfondo-1».
   Pulsanti alti almeno 64 px, testo almeno 16 px, nessuno scorrimento orizzontale. */
:root{--bg:#07080b;--panel:#101217;--card:#0d0f14;--plate:#181b22;--text:#f6f7f9;--muted:#a3a6b2;
  --red:#ff3048;--yel:#ffc531;--line:rgba(255,255,255,.10);--gut:24px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.2 Roboto,system-ui,sans-serif;overflow-x:hidden}
body.pl{overflow:hidden}
/* sfondo «Luci»: aloni fermi su uno strato fisso, così non si ridisegnano mentre la pagina scorre */
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(ellipse 70% 55% at 8% 0%,rgba(255,48,72,.22),transparent 70%),radial-gradient(ellipse 60% 50% at 100% 100%,rgba(140,20,60,.30),transparent 70%),radial-gradient(ellipse 50% 40% at 85% 10%,rgba(90,40,160,.16),transparent 70%),linear-gradient(180deg,#0b0a10,#07080b)}
button{font:inherit;color:inherit;cursor:pointer;margin:0}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}

/* barra alta: logo, recenti, cerca, admin */
.top{display:flex;align-items:center;gap:14px;padding:2px var(--gut) 0;height:66px}
.logo{font-size:27px;font-weight:900;letter-spacing:.5px;white-space:nowrap}
.logo span{color:var(--red)}
.recenti{display:flex;align-items:center;gap:10px;flex:1 1 0;min-width:0}
.lbl{color:var(--muted);font-size:16px}
.chip{height:64px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:17px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.chip.sito::after{content:" \2197";color:var(--muted);font-weight:400}
.cerca{height:64px;width:140px;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 16px;border-radius:14px;
  border:1px solid rgba(255,255,255,.18);background:#0b0c10;color:var(--muted);font-size:17px;margin-left:auto}
.ricerca{display:flex;flex:1 1 0;min-width:0;gap:10px}
.ricerca input{flex:1 1 0;min-width:0;height:64px;padding:0 18px;border-radius:14px;border:1px solid var(--red);background:#0b0c10;
  color:var(--text);font:inherit;font-size:20px}
.ricerca button{flex:0 0 64px;height:64px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-size:22px}
.admin{height:64px;padding:0 12px;display:flex;align-items:center;color:#6f7280;font-size:16px;border-radius:12px;flex:0 0 auto}

/* pillole delle categorie */
/* le pillole stanno a metà tra la barra alta e il primo gruppo (38 px sopra e sotto) */
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:38px var(--gut) 34px}
.pill{height:64px;border-radius:999px;border:1px solid var(--line);background:#11131a;color:#e4e6eb;font-size:19px;font-weight:800;
  display:flex;align-items:center;justify-content:center;white-space:nowrap}
.pill.on{background:var(--red);border-color:var(--red);color:#fff}
/* il pallino compare solo quando stato.json ha risposto (o è mancato): finché non si sa, il posto è vuoto e il verde non si afferma */
.stato,.sp{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:9px}
.stato.ok{background:#2fd06b;box-shadow:0 0 0 3px rgba(47,208,107,.18)}
.stato.ko{background:var(--yel);box-shadow:0 0 0 3px rgba(255,197,49,.18)}

/* scelta del sito (categoria con più siti): strato sopra la pagina, un pulsante grande per sito */
#scelta{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(7,8,11,.9)}
.sc{display:flex;flex-direction:column;gap:14px;width:min(460px,100% - 48px)}
#scLista{display:flex;flex-direction:column;gap:14px}
.sc p{margin:0 0 4px;font-size:22px;font-weight:800}
.sc button{height:64px;display:flex;align-items:center;padding:0 22px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-size:22px;font-weight:700}
.sc button:hover{border-color:rgba(255,48,72,.6)}
.sc .sito::after{content:"\2197";margin-left:auto;color:var(--muted);font-weight:400}

/* gruppi e schede dei canali */
.gruppi{padding:0 var(--gut)}
.gruppo{padding-top:4px}
.gruppo h2{display:flex;align-items:center;gap:10px;margin:0 0 4px;font-size:20px;line-height:24px;font-weight:800}
.gruppo h2::before{content:"";width:4px;height:18px;background:var(--red);border-radius:2px}
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:5px 10px}
.ch{height:64px;display:flex;align-items:center;gap:10px;padding:0 8px 0 4px;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:14px;min-width:0}
/* targa: il logo, o la sigla se manca */
.plate{flex:0 0 auto;width:58px;height:54px;border-radius:10px;background:var(--plate);display:flex;align-items:center;
  justify-content:center;font-weight:900;color:#fff;letter-spacing:-.3px;line-height:1}
.plate.s1{font-size:28px}.plate.s3{font-size:20px}.plate.s4{font-size:17px}.plate.s5{font-size:16px;letter-spacing:-.6px}
.plate img{display:none;width:50px;height:46px;object-fit:contain}
.plate.ok img{display:block}
.info{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.info b,.live,.prog{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info b{font-size:17px;font-weight:700}
.live{font-size:16px;font-weight:800;letter-spacing:1px;color:var(--red)}
.prog{font-size:16px;color:var(--muted)}
.prog:empty{display:none}
/* canale segnalato come non funzionante: scheda gialla, ma si può cliccare lo stesso */
.ch.off{background:transparent;border-style:dashed;border-color:rgba(255,197,49,.5)}
.ch.off .plate{background:#121318;color:#8a7a4a}
.ch.off b{color:#c9c2a8}
.ch.off .live{color:var(--yel);letter-spacing:0;font-weight:600}
.sk{height:64px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.msg{padding:12px var(--gut);font-size:20px;color:var(--muted)}
.fondo{display:flex;justify-content:center;padding:8px 0 24px}
.su{height:64px;padding:0 26px;border-radius:999px;border:1px solid var(--line);background:#11131a;font-size:17px;font-weight:600}
.chip:hover,.pill:hover,.ch:hover,.su:hover,.cerca:hover{border-color:rgba(255,48,72,.6)}
.ch.off:hover{border-color:var(--yel)}
.admin:hover{color:#c9ccd4}

/* lettore: strato a tutto schermo, senza angoli arrotondati né ritagli attorno al video */
#modal{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;z-index:9999}
#modal.open{display:block}
#video{position:absolute;top:0;left:0;width:100%;height:100%;background:#000;object-fit:contain}
.barra{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px var(--gut);pointer-events:none}
.barra{align-items:flex-start}
.nome{flex:1 1 0;min-width:0}
.barra strong{font-size:20px;text-shadow:0 2px 6px #000}
/* in onda ora (R16): riga sotto il nome, senza riquadro, e barretta di avanzamento; spariscono con la barra */
#inonda{margin-top:2px;font-size:18px;font-weight:500;color:rgba(255,255,255,.8);text-shadow:0 0 4px #000,0 2px 6px #000;white-space:pre;overflow:hidden;text-overflow:ellipsis}
#avanza{width:220px;height:3px;margin-top:8px;border-radius:2px;background:rgba(255,255,255,.2);overflow:hidden}
#avanza i{display:block;height:100%;width:0;background:var(--red)}
/* titolo e X spariscono come il puntatore di Muflone (3 s senza movimento) con la sola opacità: l'elemento resta nella pagina,
   perché Indietro di Muflone esegue closePlayer.click() anche a controlli nascosti; nascosti non prendono i clic.
   Il pannello d'errore non si nasconde mai, e con lui restano i controlli. */
.barra{transition:opacity .2s}
#modal.nasc:not(.errore) .barra{opacity:0}
#modal.nasc:not(.errore) #closePlayer{pointer-events:none}
#closePlayer{flex:none;pointer-events:auto;width:64px;height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.6);font-size:24px}
/* lettore aperto: niente si ridisegna dietro (sulla chiavetta il ridisegno sotto il video fa fermare hls.js) */
body.pl>:not(#modal){visibility:hidden}body.pl::before{display:none}
#dopo{position:absolute;left:var(--gut);bottom:var(--gut);text-shadow:0 0 4px #000,0 2px 6px #000;font-size:20px;font-weight:600}
#err{display:none;position:absolute;top:0;left:0;right:0;bottom:0;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  background:#000;text-align:center;padding:0 var(--gut)}
#modal.errore #err{display:flex}
#modal.errore #video{visibility:hidden}
#err p{margin:0;font-size:28px;font-weight:700}
#err div{display:flex;gap:16px}
#err button{height:64px;min-width:160px;padding:0 28px;border-radius:999px;border:1px solid var(--line);background:#11131a;font-size:20px;font-weight:700}
#err #riprova{background:var(--red);border-color:var(--red)}

/* schermi stretti (telefono): le righe vanno a capo */
@media(max-width:700px){
  .top{height:auto;flex-wrap:wrap;padding-top:8px}
  .recenti{flex:1 1 100%;order:3;flex-wrap:wrap}
  .cats{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
}
</style>
</head>
<body>
<header class="top">
  <div class="logo">IL <span>REGNO</span></div>
  <nav class="recenti" id="recenti" aria-label="Aperti di recente" hidden></nav>
  <button class="cerca" id="cerca">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ff3048" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    Cerca
  </button>
  <div class="ricerca" id="ricerca" hidden>
    <input id="q" type="text" placeholder="Cerca un canale" autocomplete="off" enterkeyhint="search" aria-label="Cerca un canale">
    <button id="chiudiRicerca" aria-label="Esci dalla ricerca">&#10005;</button>
  </div>
  <a class="admin" href="admin.html">Admin</a>
</header>

<nav class="cats" aria-label="Categorie">
  <button class="pill on" id="live">Live TV</button>
  <button class="pill" data-sito="film"><i class="sp"></i>Film</button>
  <button class="pill" data-sito="serie"><i class="sp"></i>Serie TV</button>
  <button class="pill" data-sito="sport"><i class="sp"></i>Sport</button>
  <button class="pill" data-sito="anime"><i class="sp"></i>Anime</button>
</nav>

<div id="scelta" hidden role="dialog" aria-label="Scegli il sito"><div class="sc"><p id="scTit">Scegli il sito</p><div id="scLista"></div><button id="scChiudi">Chiudi</button></div></div>
<div class="msg" id="avviso" hidden></div>
<main class="gruppi" id="gruppi"><section class="gruppo"><div class="griglia"><i class="sk"></i><i class="sk"></i><i class="sk"></i><i class="sk"></i><i class="sk"></i><i class="sk"></i><i class="sk"></i><i class="sk"></i></div></section></main>
<div class="fondo"><button class="su" id="su">&#8593; Torna in cima</button></div>

<div id="modal">
  <video id="video" playsinline></video>
  <div class="barra"><div class="nome"><strong id="titolo"></strong><div id="inonda" hidden></div><div id="avanza" hidden><i></i></div></div><button id="closePlayer" aria-label="Esci">&#10005;</button></div>
  <div id="dopo" hidden></div>
  <div id="err"><p id="errmsg"></p><div><button id="riprova">Riprova</button><button id="chiudi">Chiudi</button></div></div>
</div>

<script>
// Dati: una sola richiesta REST a Firebase; l'ultima copia buona resta sul dispositivo e si disegna subito.
const DB="https://il-regno-app-default-rtdb.europe-west1.firebasedatabase.app/v2.json";
const $=s=>document.querySelector(s);
const MESI="gennaio febbraio marzo aprile maggio giugno luglio agosto settembre ottobre novembre dicembre".split(" ");
const arr=x=>Array.isArray(x)?x.filter(Boolean):x?Object.values(x):[];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mem={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};
let D=null, STATO={}, GUIDA={}, secondari=false, statoNoto=false;

// ---------- copia sul dispositivo ----------
function leggiCache(){
  try{
    const o=JSON.parse(mem.get("ilregno.v2")), v=o.canali?o:Object.values(o).find(x=>x&&x.canali);
    const d=new Date(o.d||o.data||o.ts||o.date||0);   // forma scritta da salvaCache; il resto per tolleranza
    return v?{v,d:isNaN(d)?null:d}:null;
  }catch(e){return null}
}
const salvaCache=v=>mem.set("ilregno.v2",JSON.stringify({d:new Date().toISOString(),v}));

// ---------- programmi (guida): quello in onda e il successivo ----------
function programmi(c){
  const l=arr(GUIDA.canali&&GUIDA.canali[c.epg||c.id]), n=Date.now();
  // le voci possono sovrapporsi (21:20 inizia prima che finisca il programma delle 20:39): in onda è quella partita per ultima,
  // la successiva è la prima che inizia dopo adesso
  let ora,dopo;
  l.forEach(p=>{
    const i=Date.parse(p.i), f=Date.parse(p.f);
    if(i<=n&&n<f){if(!ora||i>Date.parse(ora.i))ora=p}
    else if(i>n&&(!dopo||i<Date.parse(dopo.i)))dopo=p;
  });
  return {ora,dopo};
}

// ---------- disegno ----------
function scheda(c){
  const n=(c.sigla||"").length, z=n<=2?"s1":"s"+Math.min(n,5);
  return `<button class="ch" data-t="canale" data-i="${esc(c.id)}"><span class="plate ${z}">`+
    `<img data-src="loghi/${esc(c.id)}.webp" width="50" height="46" alt=""><span class="sg">${esc(c.sigla||"")}</span></span>`+
    `<span class="info"><b>${esc(c.nome)}</b><span class="live">&#9679; LIVE</span><span class="prog"></span></span></button>`;
}
function disegna(){
  const q=$("#q").value.trim().toLowerCase();
  const gr=[...D.gruppi];
  D.canali.forEach(c=>{c.gruppo=c.gruppo||"Altri"; if(!gr.includes(c.gruppo))gr.push(c.gruppo)});
  let h="", n=0;
  gr.forEach(g=>{
    const l=D.canali.filter(c=>c.gruppo===g&&(!q||String(c.nome).toLowerCase().includes(q)));
    if(!l.length)return;
    n+=l.length;
    h+=`<section class="gruppo"><h2>${esc(g)}</h2><div class="griglia">${l.map(scheda).join("")}</div></section>`;
  });
  $("#gruppi").innerHTML=n?h:'<div class="msg" style="padding-left:0">Nessun canale trovato</div>';
  aggiorna(); recenti(); osservaLoghi();
}
// stato dei link e programma in onda: si applicano sulle schede già disegnate
function aggiorna(){
  if(statoNoto)document.querySelectorAll("[data-sito]").forEach(el=>{
    // la pillola è verde se almeno uno dei suoi siti è ok
    const ko=sitiDi(el.dataset.sito).every(x=>((STATO.siti||{})[x.id]||{}).ok===false);
    el.firstElementChild.className="stato "+(ko?"ko":"ok");
  });
  if(!D)return;
  document.querySelectorAll(".ch").forEach(el=>{
    const c=trova("canale",el.dataset.i); if(!c)return;
    const ko=((STATO.canali||{})[c.id]||{}).ok===false;
    el.classList.toggle("off",ko); el.classList.toggle("ko",ko);
    el.querySelector(".live").innerHTML=ko?"non disponibile":"&#9679; LIVE";
    el.querySelector(".prog").textContent=ko?"":(programmi(c).ora||{}).t||"";
  });
}
// logo: si chiede solo quando la scheda è nella schermata o vicina (200 px); finché non arriva si vede la sigla, e se manca resta la sigla
const vista=window.IntersectionObserver&&new IntersectionObserver(l=>l.forEach(o=>{
  if(!o.isIntersecting)return;
  vista.unobserve(o.target); caricaLogo(o.target);
}),{rootMargin:"200px"});
function caricaLogo(el){
  const i=el.querySelector("img[data-src]"); if(!i)return;
  i.onload=()=>{i.parentNode.classList.add("ok"); const s=i.parentNode.querySelector(".sg"); if(s)s.remove()};   // il load non arriva a window: si ascolta sull'immagine
  i.src=i.dataset.src; i.removeAttribute("data-src");
}
function osservaLoghi(){
  if(vista)vista.disconnect();
  document.querySelectorAll(".ch").forEach(el=>vista?vista.observe(el):caricaLogo(el));
}
addEventListener("error",e=>{
  const i=e.target;
  if(i.tagName==="IMG"&&i.parentNode.classList.contains("plate"))i.remove();
},true);

// ---------- recenti (ultime 3 cose aperte) ----------
const trova=(tipo,id)=>D&&(tipo==="sito"?D.siti:D.canali).find(x=>x.id===id);
function leggiRecenti(){try{return JSON.parse(mem.get("ilregno.recenti"))||[]}catch(e){return[]}}
function recenti(){
  const v=leggiRecenti().map(x=>({x,o:trova(x.tipo,x.id)})).filter(a=>a.o), el=$("#recenti");
  el.innerHTML=v.length?'<span class="lbl">Recenti</span>'+v.map(a=>
    `<button class="chip ${a.x.tipo}" data-t="${a.x.tipo}" data-i="${esc(a.x.id)}">${esc(a.o.nome)}</button>`).join(""):"";
  el.hidden=!v.length||!$("#ricerca").hidden;
}
// i siti di una categoria (pillola): quelli con "pillola" uguale, o senza "pillola" e con quell'id
const sitiDi=cat=>D?D.siti.filter(x=>(x.pillola||x.id)===cat):[{id:cat}];
function categoria(cat){
  const l=sitiDi(cat);
  if(l.length>1)scelta(cat,l);
  else if(l.length)apri("sito",l[0].id);
}
// Indietro di Muflone chiude la scelta come la ricerca: una voce di cronologia in più, tolta se la scelta si chiude in altro modo
// o prima di aprire il sito, così dal sito si torna a Il Regno senza un Indietro a vuoto
let voceScelta=false, attesa=0, vaA=null;
function scelta(cat,l){
  const nome=$(`[data-sito="${cat}"]`).textContent.trim();
  $("#scTit").textContent=nome;
  $("#scLista").innerHTML=l.map(x=>`<button class="sito" data-t="sito" data-i="${esc(x.id)}"><i class="stato ${((STATO.siti||{})[x.id]||{}).ok===false?"ko":"ok"}"></i>${esc(x.nome)}</button>`).join("");
  $("#scelta").hidden=false; $("#scLista button").focus();
  if(!voceScelta){history.pushState(null,"");voceScelta=true}
}
function chiudiScelta(dalBack){
  if(!voceScelta)return;
  $("#scelta").hidden=true; voceScelta=false;
  if(!dalBack){attesa++; history.back()}
}
// apre il sito in questa schermata; con la scelta aperta prima toglie la sua voce di cronologia
function vai(url){
  if(!voceScelta)return void(location.href=url);
  vaA=url; chiudiScelta(false); setTimeout(vaPoi,500);
}
function vaPoi(){if(vaA){const u=vaA;vaA=null;location.href=u}}
function apri(tipo,id){
  const o=trova(tipo,id); if(!o)return;
  mem.set("ilregno.recenti",JSON.stringify([{tipo,id},...leggiRecenti().filter(x=>!(x.tipo===tipo&&x.id===id))].slice(0,3)));
  recenti();
  if(tipo==="canale")riproduci(o);
  else if(o.url)vai(o.url);
}

// ---------- lettore ----------
const M=$("#modal"), V=$("#video");
let tok=0, hls=null, tm=[], cur=null, pos=0, rai=null, nrai=0;
const entro=(f,ms)=>tm.push(setTimeout(f,ms));
function ferma(){
  tok++; tm.forEach(clearTimeout); tm=[]; rai=null;
  V.onerror=V.onplaying=null;
  if(hls){hls.destroy();hls=null}
  V.pause(); V.removeAttribute("src"); V.load();
}
function chiudiLettore(){
  ferma(); M.className=""; clearTimeout(tb);
  document.body.classList.remove("pl"); $("#dopo").hidden=true; clearInterval(ti);
  if(scrollY!==pos)scrollTo(0,pos);
}
// V01 manca l'indirizzo o hls.js non parte, V02 non parte entro 10 s o errore del video, V03 indirizzo Rai non ottenuto,
// V04 indirizzo Sky non ottenuto
function fallito(k,cod){
  if(k!==tok)return;
  ferma(); console.warn("lettore",cur.id,cod);
  $("#errmsg").textContent=`${cur.nome} non disponibile ora (codice ${cod})`;
  M.classList.add("errore"); $("#riprova").focus();
}
function riproduci(c){
  if(!M.classList.contains("open"))pos=scrollY;
  ferma(); cur=c;
  M.className="open"; document.body.classList.add("pl"); mostraBarra(true);
  $("#titolo").textContent=c.nome; $("#dopo").hidden=true;
  inOnda(c); clearInterval(ti); ti=setInterval(()=>inOnda(c),60000);
  const k=tok;
  V.onplaying=()=>{if(k===tok){V.onplaying=null;partito(c)}};   // solo la prima partenza: dopo uno scatto «Dopo» non ricompare
  entro(()=>fallito(k,"V02"),10000);
  if(c.sky)return chiediSky(c,k);
  if(!c.url)return fallito(k,"V01");
  if(c.rai)return chiediRai(c,k);
  suona(c.url,k);
}
// canale normale: prima il lettore nativo, se non sa leggere il flusso o non avanza si riprova una volta con hls.js
function suona(url,k){
  let usato=false;
  const conHls=()=>{if(usato||k!==tok)return;usato=true;V.removeAttribute("src");V.load();suHls(url,k)};
  V.onerror=conHls;
  entro(conHls,6000);
  V.src=url; V.play().catch(()=>{});
}
// Sky: l'indirizzo ha un gettone di 5 minuti, quindi non sta nei dati; lo si chiede all'API pubblica di Sky a ogni apertura
// (e a ogni «Riprova») e poi si suona come un canale normale. La pagina scarica solo il JSON: playlist e pezzi li chiede il lettore.
function chiediSky(c,k){
  fetch("https://video.sky.it/api/v1/getLivestream?id="+encodeURIComponent(c.sky)+"&isMobile=false",{signal:AbortSignal.timeout(5000)})
    .then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{
      if(k!==tok)return;
      if(!(j&&typeof j.streaming_url==="string"&&j.streaming_url))throw 0;
      suona(j.streaming_url,k);
    }).catch(()=>fallito(k,"V04"));
}
// titolo e X: visibili all'apertura e a ogni movimento o clic nel lettore, spariscono 3 s dopo l'ultimo (come il puntatore di Muflone,
// che alla pagina manda solo il movimento del mouse e i clic). A controlli nascosti la X non prende il clic (pointer-events:none):
// il clic cade sul video e li mostra soltanto; dopo la pressione la X torna cliccabile, ma pressione e rilascio sono su elementi
// diversi e il browser non genera il clic sulla X.
let tb=0, ti=0;
// cosa va in onda adesso sul canale aperto: «HH:MM – HH:MM  Titolo» e quanto ne è passato; senza guida la riga e la barretta non ci sono
function inOnda(c){
  const p=programmi(c).ora, ok=!!p;
  $("#inonda").hidden=$("#avanza").hidden=!ok;
  if(!ok)return;
  const i=Date.parse(p.i), f=Date.parse(p.f);
  $("#inonda").textContent=p.i.slice(11,16)+" \u2013 "+p.f.slice(11,16)+"  "+p.t;
  $("#avanza i").style.width=Math.max(0,Math.min(100,(Date.now()-i)/(f-i)*100)).toFixed(1)+"%";
}
function mostraBarra(forza){
  if(!forza&&!M.classList.contains("open"))return;
  M.classList.remove("nasc"); clearTimeout(tb);
  tb=setTimeout(()=>M.classList.add("nasc"),3000);
}
["mousemove","pointermove","pointerdown","click"].forEach(t=>M.addEventListener(t,()=>mostraBarra()));
// il video è partito: si fermano i controlli di tempo e per qualche secondo si legge cosa viene dopo
function partito(c){
  tm.forEach(clearTimeout); tm=[];
  const p=programmi(c).dopo;
  if(!p)return;
  $("#dopo").textContent="Dopo: "+p.i.slice(11,16)+" "+p.t; $("#dopo").hidden=false;
  entro(()=>$("#dopo").hidden=true,6000);
}
function suHls(url,k){
  const pronto=()=>{
    if(k!==tok)return;
    if(!Hls.isSupported())return fallito(k,"V01");
    hls=new Hls();
    hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)fallito(k,"V02")});
    V.onerror=()=>fallito(k,"V02");
    hls.attachMedia(V); hls.loadSource(url);
    V.play().catch(()=>{});
  };
  if(window.Hls)return pronto();
  const s=document.createElement("script");   // hls.js si scarica solo quando serve
  s.src="hls.light.min.js"; s.onload=pronto; s.onerror=()=>fallito(k,"V01");
  document.head.append(s);
}
// Rai: l'indirizzo con gettone lo chiede Muflone al momento (risposta in ilRegnoRai); poi lo legge hls.js
function chiediRai(c,k){
  if(!(window.Muflone&&Muflone.risolviRai))return fallito(k,"V03");
  rai=u=>{rai=null;u?suHls(u,k):fallito(k,"V03")};
  rai.id=String(++nrai);
  entro(()=>{if(rai)fallito(k,"V03")},5000);
  try{Muflone.risolviRai(rai.id,c.url)}catch(e){fallito(k,"V03")}
}
window.ilRegnoRai=(id,u)=>{if(rai&&rai.id===String(id))rai(u)};

// ---------- ricerca ----------
// Indietro di Muflone torna alla pagina precedente (non manda Esc): aprendo la ricerca si aggiunge una voce alla cronologia,
// così Indietro la chiude; chiudendola in altro modo (✕, Esc, Live TV) quella voce si toglie, senza lasciare un Indietro a vuoto
let voceRicerca=false;
function ricerca(on,dalBack){
  if(on===!$("#ricerca").hidden)return;
  $("#cerca").hidden=on; $("#ricerca").hidden=!on;
  if(on){$("#q").focus(); if(!voceRicerca){history.pushState(null,"");voceRicerca=true}}
  else{
    $("#q").value="";
    if(voceRicerca){voceRicerca=false; if(!dalBack)history.back()}
  }
  if(D)disegna();
}
addEventListener("popstate",()=>{
  if(attesa){attesa--; vaPoi(); return}
  if(voceScelta)chiudiScelta(true);
  else if(voceRicerca)ricerca(false,true);
});

// ---------- eventi ----------
document.addEventListener("click",e=>{
  if(e.target.id==="scelta")return chiudiScelta();
  const b=e.target.closest("button"); if(!b)return;
  if(b.dataset.t)return apri(b.dataset.t,b.dataset.i);
  if(b.dataset.sito)return categoria(b.dataset.sito);
  switch(b.id){
    case "live": if(!$("#ricerca").hidden)ricerca(false); return scrollTo(0,0);
    case "su": return scrollTo(0,0);
    case "cerca": return ricerca(true);
    case "chiudiRicerca": return ricerca(false);
    case "scChiudi": return chiudiScelta();
    case "closePlayer": case "chiudi": return chiudiLettore();
    case "riprova": return riproduci(cur);
  }
});
$("#q").addEventListener("input",()=>D&&disegna());
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape")return;
  if(voceScelta)chiudiScelta();
  else if(M.classList.contains("open"))chiudiLettore();
  else if(!$("#ricerca").hidden)ricerca(false);
});
addEventListener("pageshow",recenti);   // tornando indietro da un sito
setInterval(aggiorna,60000);            // il programma in onda cambia

// ---------- avvio ----------
function mostra(v){
  D={gruppi:arr(v.gruppi),canali:arr(v.canali),siti:arr(v.siti)};
  $("#avviso").hidden=true; disegna(); dopoPrimaSchermata();
}
// stato dei link e guida si chiedono solo dopo che i canali sono visibili
function dopoPrimaSchermata(){
  if(secondari)return; secondari=true;
  fetch("stato.json").then(r=>{if(!r.ok)throw 0;return r.json()}).then(s=>{STATO=s}).catch(()=>{}).then(()=>{statoNoto=true;aggiorna()});   // senza stato.json: tutti ok (sconosciuto)
  fetch("guida.json").then(r=>r.json()).then(g=>{GUIDA=g;aggiorna()}).catch(()=>{});
}
const cache=leggiCache();
if(cache)mostra(cache.v);
fetch(DB,{signal:AbortSignal.timeout(8000)}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(v=>{
  if(!v||!v.canali)throw 0;
  salvaCache(v); mostra(v);
}).catch(()=>{
  console.warn("D01 database non raggiungibile");
  const a=$("#avviso"), d=cache&&cache.d;
  a.textContent="Nessuna connessione"+(d?`: dati del ${d.getDate()} ${MESI[d.getMonth()]}`:"");
  a.hidden=false;
  if(!cache){$("#gruppi").innerHTML=""; dopoPrimaSchermata()}
});
</script>
